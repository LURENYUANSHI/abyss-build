<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>美术资源预览</title>
<style>
:root{--bg:#0e0c18;--fg:#e8e4ff;--dim:#8a84b0;--line:#2c2846;--bad:#ff6a6a;--ok:#7dff8a}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:#151226;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}
select,input,button{background:#1d1934;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
main{padding:12px;display:grid;gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;background:#141127}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
canvas{image-rendering:pixelated;border-radius:6px}
.iss{color:var(--bad);font-size:12px}.okk{color:var(--ok);font-size:12px}
small{color:var(--dim)}
</style></head><body>
<header>
  <b>美术资源预览</b>
  <select id="type"><option value="">全部类型</option><option value="boss">首领</option><option value="mob">小怪</option><option value="add">变身/召唤</option><option value="prop">机关</option><option value="walk">职业走路</option><option value="fx">特效</option></select>
  <input id="q" placeholder="搜索图集名，如 mc / icc / naxx_3z" size="22">
  <label><input type="checkbox" id="onlyBad"> 只看有问题的</label>
  <select id="bg"><option value="tile">地牢地面</option><option value="check">棋盘格（看透明）</option><option value="dark">纯黑</option></select>
  帧率 <input id="fps" type="number" value="8" min="1" max="24" style="width:48px">
  缩放 <input id="zoom" type="number" value="2" min="1" max="4" style="width:48px">
</header>
<main id="list"></main>
<script>
// 读取 art/_manifest.json（图集类型与每组帧数）和 art/_report.json（tools/artprep.swift 的检查结果）
const BASE='../art/';let MAN={},REP={},imgs={};
const $=id=>document.getElementById(id);
Promise.all([fetch(BASE+'_manifest.json').then(r=>r.json()),fetch(BASE+'_report.json').then(r=>r.json()).catch(()=>[])]).then(([m,r])=>{MAN=m;for(const x of r)REP[x.sheet]=x.issues||[x.issue];build();});
for(const id of['type','q','onlyBad','bg','zoom'])$(id).addEventListener('input',build);
function raidOf(n){const m=/^(?:bosses|mobs|adds|props)_([a-z0-9]+?)(?:_\d+)?[xz]?$/.exec(n);return m&&m[1];}
function load(n){if(imgs[n])return imgs[n];const im=new Image();im.src=BASE+n+'.png';return imgs[n]=im;}
let cards=[];
function build(){const t=$('type').value,q=$('q').value.trim(),bad=$('onlyBad').checked;const L=$('list');L.innerHTML='';cards=[];
  for(const[n,[k,per]]of Object.entries(MAN)){if(k==='tiles'||(t&&k!==t)||(q&&!n.includes(q))||(bad&&!REP[n]))continue;
    const c=document.createElement('div');c.className='card';const iss=REP[n];
    c.innerHTML=`<div><b>${n}</b> <small>${k} · 每组 ${per} 帧</small> ${iss?`<span class="iss">⚠ ${iss.length} 处：${iss.slice(0,4).join('；')}${iss.length>4?'…':''}</span>`:'<span class="okk">✓ 通过检查</span>'}</div><div class="row"></div>`;
    L.appendChild(c);const im=load(n),row=c.querySelector('.row');
    const go=()=>{const s=im.height,nf=Math.round(im.width/s),z=+$('zoom').value,groups=Math.ceil(nf/per);
      for(let g=0;g<groups;g++){const cv=document.createElement('canvas');cv.width=cv.height=s*z;row.appendChild(cv);
        // 每组再给一个整排缩略，方便看帧间是否漂移
        const strip=document.createElement('canvas');strip.width=s*Math.min(per,nf-g*per)*z/2;strip.height=s*z/2;row.appendChild(strip);
        cards.push({cv,strip,im,s,g,per:Math.min(per,nf-g*per),z,fx:k==='fx',raid:raidOf(n)});}};
    if(im.complete&&im.naturalWidth)go();else im.onload=go;}}
const tileCache={};
function floor(raid){if(!raid)return null;const k='tiles_'+raid;if(tileCache[k]!==undefined)return tileCache[k];tileCache[k]=null;const im=new Image();im.onload=()=>tileCache[k]=im;im.src=BASE+k+'.png';return null;}
function bgFill(x,c,raid,w,h){const mode=$('bg').value;
  if(mode==='check'){for(let y=0;y<h;y+=8)for(let i=0;i<w;i+=8){x.fillStyle=((i+y)/8)%2?'#3a3650':'#26223a';x.fillRect(i,y,8,8);}return;}
  if(mode==='tile'){const T=floor(raid);if(T){const ts=T.width/4;for(let y=0;y<h;y+=ts)for(let i=0;i<w;i+=ts)x.drawImage(T,((i/ts+y/ts)%4)*ts,0,ts,ts,i,y,ts,ts);x.fillStyle='rgba(0,0,0,.25)';x.fillRect(0,0,w,h);return;}}
  x.fillStyle='#08070f';x.fillRect(0,0,w,h);}
let t0=performance.now();
function tick(now){const fps=+$('fps').value||8,f=Math.floor((now-t0)/1000*fps);
  for(const C of cards){const{cv,strip,im,s,g,per,z,fx,raid}=C,x=cv.getContext('2d');x.imageSmoothingEnabled=false;
    bgFill(x,cv,raid,cv.width,cv.height);const k=g*per+(f%per);
    if(fx){x.globalCompositeOperation='lighter';}x.drawImage(im,k*s,0,s,s,0,0,s*z,s*z);x.globalCompositeOperation='source-over';
    if(!fx){x.strokeStyle='rgba(255,90,90,.8)';x.beginPath();x.moveTo(0,(s-2)*z+.5);x.lineTo(s*z,(s-2)*z+.5);x.stroke();   // 脚底基线
      x.strokeStyle='rgba(90,200,255,.5)';x.beginPath();x.moveTo(s*z/2+.5,0);x.lineTo(s*z/2+.5,s*z);x.stroke();}   // 中线
    if(!strip._done&&im.complete){const y=strip.getContext('2d');bgFill(y,strip,raid,strip.width,strip.height);for(let i=0;i<per;i++)y.drawImage(im,(g*per+i)*s,0,s,s,i*s*z/2,0,s*z/2,s*z/2);strip._done=1;}}
  requestAnimationFrame(tick);}
requestAnimationFrame(tick);
</script></body></html>
