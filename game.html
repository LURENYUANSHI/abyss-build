<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深渊构筑原型</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;font-family:"Noto Sans SC",sans-serif}
  #phone{position:relative;width:390px;height:693px;overflow:hidden;background:#07070c;flex:none;transform-origin:center}
  #g{position:absolute;left:0;top:0;width:390px;height:693px}

  /* HUD */
  .hud{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:flex-start;color:#fff;z-index:5;pointer-events:none}
  #ava{width:38px;height:38px;border:1px solid rgba(170,140,255,.6);background:#141631;image-rendering:pixelated}
  .bars{flex:1;display:flex;flex-direction:column;gap:3px;padding-top:2px}
  .bar{height:8px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:100%}
  .bar.sh{height:3px;display:none}.bar.sh.on{display:block}
  #hpI{background:#e5484d}#shI{background:#9fd8ff}#enI{background:#b47cff}
  .bars small{font:7px "Press Start 2P";color:#cfd2e6}
  .right{text-align:right;font-size:11px;color:#c9cce0;line-height:1.6;min-width:92px}
  .right b{font:9px "Press Start 2P";color:#fff}
  #killT{font-size:10px;color:#ffcf6a}
  .xp{position:absolute;left:0;right:0;top:64px;height:5px;background:rgba(255,255,255,.08);z-index:5;pointer-events:none}
  .xp i{position:absolute;left:0;top:0;bottom:0;background:#5ad1ff;box-shadow:0 0 8px #5ad1ff}
  #lvT{position:absolute;left:12px;top:74px;font:7px "Press Start 2P";color:#5ad1ff;z-index:5;line-height:1.8}
  #buffT{position:absolute;left:12px;top:96px;font-size:10px;color:#ffd77a;z-index:5;line-height:1.5;pointer-events:none}
  #mm{position:absolute;right:12px;top:76px;width:64px;height:64px;z-index:5;pointer-events:none;background:rgba(10,10,20,.55);border:1px solid rgba(170,140,255,.3)}
  #bossBar{position:absolute;left:50px;right:84px;top:84px;z-index:5;display:none;text-align:center;pointer-events:none}
  #bossBar.on{display:block}
  #bossBar span{font-size:10px;color:#ff8a8a;letter-spacing:2px}
  #bossBar .bar{height:6px;margin-top:3px;border:1px solid rgba(255,90,90,.5)}
  #bossI{background:linear-gradient(90deg,#c0244a,#ff5a7a)}

  /* 操作 */
  #joy{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);z-index:4;pointer-events:none;left:195px;top:600px;opacity:0}
  #joy.act{opacity:1}
  #knob{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.3)}
  .btn{position:absolute;border-radius:50%;z-index:6;display:grid;place-items:center;pointer-events:none;opacity:.85}
  #skill{right:84px;bottom:28px;width:44px;height:44px;border:2px solid #6fdcff;color:#9ff1ff;font-size:10px;font-weight:700;
    background:conic-gradient(rgba(0,0,0,.7) calc(var(--cd,0)*1%),rgba(20,40,70,.85) 0)}
  #skill.seal{border-color:#ff5a5a;color:#ff8a8a}
  #ult{right:20px;bottom:24px;width:56px;height:56px;pointer-events:auto;cursor:pointer;opacity:1;background:conic-gradient(#c58bff calc(var(--en,0)*1%),rgba(255,255,255,.12) 0)}
  #ult span{width:48px;height:48px;border-radius:50%;background:#2a1748;display:grid;place-items:center;color:#a98bc8;font-weight:900;font-size:12px}
  .btn .ic{position:absolute;inset:6px;border-radius:50%;background-size:cover;background-position:center;image-rendering:pixelated;display:none}
  .btn.hasic .ic{display:block}.btn.hasic em{display:none}#ult .ic{inset:4px}#skill em,#ult em{font-style:normal}
  #ult.ready{animation:pulse 1s infinite}#ult.ready span{color:#fff;background:#4a2590}
  @keyframes pulse{50%{box-shadow:0 0 22px #b47cff}}
  #muteB{left:12px;bottom:28px;width:26px;height:26px;font-size:13px;color:#c8c0ff;border:1px solid rgba(160,140,255,.35);background:rgba(15,16,32,.75);pointer-events:auto;cursor:pointer}
  #muteB.off{opacity:.4;text-decoration:line-through}
  #hexB{left:12px;bottom:62px;width:26px;height:26px;border-radius:6px;color:#d9c7ff;border:1px solid rgba(160,140,255,.5);background:rgba(15,16,32,.8);pointer-events:auto;cursor:pointer;font-size:15px;line-height:1}
  #hexB i{position:absolute;right:-6px;top:-6px;min-width:14px;height:14px;border-radius:7px;background:#7a4ae0;color:#fff;font:700 9px/14px sans-serif;font-style:normal;text-align:center;padding:0 3px}
  #hexV{position:absolute;inset:0;z-index:30;display:none;background:rgba(4,4,12,.9);padding:58px 18px 24px;overflow-y:auto;color:#e8e4ff}
  #hexV.on{display:block}#hexV h2{margin:0 0 4px;font-size:18px;letter-spacing:4px;text-align:center}#hexV .sub{text-align:center;font-size:11px;color:#9a94c0;margin-bottom:12px}
  #hexV .row{text-align:left;display:flex;gap:10px;align-items:flex-start;padding:9px 10px;margin-bottom:6px;border:1px solid rgba(160,140,255,.22);border-radius:6px;background:rgba(30,26,60,.55)}
  #hexV .row .icon{width:30px;height:30px;flex:none}#hexV .row .icon svg{width:30px;height:30px}#hexV .row b{font-size:13px}#hexV .row .tag{margin:0 0 0 6px}#hexV .row .d{text-align:left;font-size:11px;color:#c0bada;margin-top:3px;line-height:1.5}
  #hexV .none{text-align:center;color:#8a84b0;margin-top:40px;font-size:12px}
  #fade{position:absolute;inset:0;background:#000;z-index:25;opacity:0;pointer-events:none;transition:opacity .35s}
  #fade.on{opacity:1}
  #hint{position:absolute;left:0;right:0;bottom:92px;text-align:center;font-size:10px;color:rgba(200,195,240,.45);letter-spacing:2px;z-index:4;pointer-events:none}

  #toast,#banner{position:absolute;left:0;right:0;text-align:center;z-index:20;pointer-events:none;opacity:0;transition:opacity .3s}
  #toast{top:150px;color:#ffd77a;font-size:12px;letter-spacing:1px;padding:0 20px}
  #banner{top:250px;color:#ff6a6a;font-size:22px;font-weight:900;letter-spacing:6px;text-shadow:0 0 12px #f00}
  .show{opacity:1!important}

  .ov{position:absolute;inset:0;z-index:10;display:none;color:#fff}
  .ov.on{display:block}

  /* 海克斯：近黑平底 + 细紫切角边 + 大量留白 */
  #pick{background:linear-gradient(180deg,rgba(4,4,12,.5) 0,rgba(4,4,12,.72) 22%,rgba(4,4,12,.88) 32%,rgba(4,4,12,.88) 74%,rgba(4,4,12,.7) 100%)}
  .head{position:absolute;left:0;right:0;top:112px;text-align:center}
  .lv{font:8px "Press Start 2P";color:#5ad1ff;letter-spacing:1px;margin-bottom:10px}
  .head h1{margin:0;font-size:23px;font-weight:900;letter-spacing:6px;display:flex;align-items:center;justify-content:center;gap:12px}
  .head h1::before,.head h1::after{content:"";width:40px;height:1px;background:linear-gradient(90deg,transparent,#a07cff)}
  .head h1::after{transform:scaleX(-1)}
  .head p{margin:8px 0 0;font-size:11px;color:#8d90ad;letter-spacing:2px}
  .cards{position:absolute;left:0;right:0;top:206px;display:flex;justify-content:center;gap:9px}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px;animation:rise .3s ease-out both}
  .col:nth-child(2){animation-delay:.05s}.col:nth-child(3){animation-delay:.1s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  .cw{filter:drop-shadow(0 0 5px rgba(200,210,230,.35));transition:transform .12s}
  .cw.t2{filter:drop-shadow(0 0 6px rgba(255,200,90,.5))}.cw.t3{filter:drop-shadow(0 0 8px rgba(220,160,255,.65))}
  @media (hover:hover){.cw:hover{transform:translateY(-6px)}}
  .cw:active{transform:scale(.97)}
  .cut{--k:9px;clip-path:polygon(var(--k) 0,calc(100% - var(--k)) 0,100% var(--k),100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,var(--k) 100%,0 calc(100% - var(--k)),0 var(--k))}
  .card{width:116px;height:310px;padding:1px;box-sizing:border-box;background:linear-gradient(180deg,#eef2fa,#7a8298 50%,#c8cede);cursor:pointer}
  .t2 .card{background:linear-gradient(180deg,#ffe8a0,#a87a22 50%,#ffd77a)}
  .t3 .card{background:linear-gradient(160deg,#ff8ad8,#8ad0ff 35%,#b0ff8a 65%,#ffd77a)}
  .inner{height:100%;background:linear-gradient(180deg,#0d0e1d,#08090f);display:flex;flex-direction:column;align-items:center;--k:8px}
  .icon{margin-top:26px;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle,#1c1d3c,#0f1024);box-shadow:inset 0 0 0 1px rgba(170,140,255,.28);display:grid;place-items:center}
  .icon svg{width:40px;height:40px}
  .t{margin-top:18px;font-size:15px;font-weight:700;letter-spacing:2px}
  .tag{margin-top:7px;font-size:9px;padding:1px 8px;border-radius:2px;letter-spacing:1px}
  .r1{color:#e4e8f2;background:rgba(200,210,230,.12);border:1px solid rgba(200,210,230,.45)}
  .r2{color:#ffd77a;background:rgba(255,200,90,.12);border:1px solid rgba(255,200,90,.45)}
  .r3{color:#fff;background:linear-gradient(90deg,rgba(255,138,216,.35),rgba(138,208,255,.35),rgba(176,255,138,.35));border:1px solid rgba(220,200,255,.6)}
  .d .neg{color:#ff7a7a}
  .div{margin:14px 0 12px;width:70%;height:1px;background:linear-gradient(90deg,transparent,rgba(170,140,255,.45),transparent);position:relative}
  .div::after{content:"";position:absolute;left:50%;top:-2px;width:4px;height:4px;background:#a98bff;transform:translateX(-50%) rotate(45deg)}
  .d{font-size:11px;line-height:1.75;color:#b5b8d2;text-align:center;padding:0 6px}
  .d em{font-style:normal;color:#fff}
  .syn{margin-top:auto;font-size:10px;color:#c8c0ff;letter-spacing:1px;display:flex;align-items:center;gap:4px}
  .syn i{width:5px;height:5px;transform:rotate(45deg);background:#3a3c58;display:inline-block}
  .syn i.on{background:#a98bff}.syn i.nx{background:#fff;box-shadow:0 0 4px #fff}
  .si{margin:6px 0 14px;font-size:9px;line-height:1.5;color:#6f7290;text-align:center;padding:0 6px}
  .si.on{color:#ffd77a}
  .excl{font-size:9px;color:#ffd77a;margin-top:4px;letter-spacing:1px}
  .reroll{font-size:10px;color:#9a9dbb;border:1px solid rgba(160,140,255,.28);background:rgba(15,16,32,.7);padding:5px 12px;display:flex;align-items:center;gap:5px;cursor:pointer;letter-spacing:1px}
  .reroll.used{opacity:.3;pointer-events:none}
  .reroll svg{width:12px;height:12px}
  .build{position:absolute;left:0;right:0;top:584px;text-align:center}
  .build p{margin:0 0 8px;font-size:10px;color:#6f7290;letter-spacing:2px}
  .chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 18px}
  .chip{display:flex;align-items:center;gap:3px;font-size:10px;color:#c8c0ff;padding:2px 7px 2px 3px;border:1px solid rgba(170,140,255,.25);border-radius:10px;background:rgba(18,19,42,.8)}
  .chip svg{width:14px;height:14px}.chip.full{color:#ffd77a;border-color:rgba(255,200,90,.45)}

  /* 大招特写 */
  #cutin{z-index:30;pointer-events:none;overflow:hidden}
  #cutin .dk{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade 1s both}
  #cutin .band{position:absolute;left:-30px;right:-30px;top:240px;height:220px;transform:skewY(-9deg);background:linear-gradient(90deg,#120a2c,#3a1c7c 55%,#120a2c);
    box-shadow:0 0 0 2px #b48cff,0 0 40px #8a55ff;animation:band 1s both}
  #cutin .lines{position:absolute;inset:0;background:repeating-linear-gradient(-9deg,transparent 0 14px,rgba(255,255,255,.06) 14px 15px)}
  #cutin canvas{position:absolute;left:-6px;top:196px;width:288px;height:288px;image-rendering:pixelated;filter:drop-shadow(0 0 10px #6fdcff);animation:slide 1s both}
  #cutin .nm{position:absolute;right:18px;top:356px;text-align:right;animation:nm 1s both}
  #cutin .nm b{display:block;font-size:30px;font-weight:900;letter-spacing:6px;text-shadow:0 0 14px #b48cff}
  #cutin .nm small{font-size:11px;letter-spacing:3px;color:#cdb8ff}
  @keyframes fade{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}
  @keyframes band{0%{transform:skewY(-9deg) scaleY(0)}12%{transform:skewY(-9deg) scaleY(1)}85%{opacity:1}100%{transform:skewY(-9deg) scaleY(1.1);opacity:0}}
  @keyframes slide{0%{transform:translateX(-260px)}18%{transform:translateX(0)}85%{transform:translateX(18px);opacity:1}100%{transform:translateX(60px);opacity:0}}
  @keyframes nm{0%,10%{transform:translateX(220px);opacity:0}28%{transform:translateX(0);opacity:1}85%{opacity:1}100%{opacity:0}}

  .panel{position:absolute;inset:0;background:rgba(5,5,14,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
  .panel h2{margin:0;font-size:30px;font-weight:900;letter-spacing:8px}
  .panel p{margin:0;color:#9da0bd;font-size:12px;line-height:1.8}
  .b{min-width:200px;padding:12px 0;font-size:15px;letter-spacing:4px;color:#fff;border:1px solid #9b7bff;background:#2b1f63;cursor:pointer;font-family:inherit}
  .b.ghost{background:transparent;color:#c8bfff}
  .stat{display:flex;gap:18px;font-size:11px;color:#9da0bd}.stat b{display:block;font:11px "Press Start 2P";color:#fff;margin-top:6px}
  #ad .panel{background:rgba(0,0,0,.92)}
  #adN{font:28px "Press Start 2P";color:#fff}
  /* 选角 */
  .classes{display:grid;grid-template-columns:repeat(3,96px);gap:8px}
  .cls{height:82px;border:1px solid rgba(160,140,255,.25);background:rgba(15,16,32,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:12px;color:#c8c0ff}
  .cls canvas{width:36px;height:42px;image-rendering:pixelated}
  .cls.on{border-color:#ffd77a;color:#fff;box-shadow:0 0 10px rgba(255,215,120,.35)}
  .cinfo{width:310px;min-height:74px;font-size:11px;color:#b5b8d2;line-height:1.7;text-align:left;border:1px solid rgba(160,140,255,.2);padding:8px 10px;background:rgba(15,16,32,.7)}
  .cinfo b{color:#fff}.cinfo em{font-style:normal;color:#ffd77a}
  .ver{font:8px "Press Start 2P";color:#6f7290}
  #mc{position:absolute;left:0;top:0;width:390px;height:693px;z-index:9;display:none;image-rendering:pixelated}
  #start .panel{background:rgba(7,7,12,.86)}
  .menu{position:absolute;inset:0}
  .logo{position:absolute;top:64px;left:0;right:0;text-align:center;font-size:46px;font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 10px #8a55ff,0 0 26px #5a2a9a,0 3px 0 #2a1748}
  .logo small{display:block;font-size:12px;letter-spacing:6px;color:#d8d0ff;text-shadow:0 1px 2px #000;margin-top:4px;font-weight:500}
  .mbtns{position:absolute;left:0;right:0;bottom:46px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .tip{font-size:10px;color:#c8c0ff;opacity:.75;margin:0;text-shadow:0 1px 2px #000}
  .mtitle{position:absolute;top:0;left:0;right:0;padding:14px 0 18px;text-align:center;font-size:20px;font-weight:900;letter-spacing:6px;color:#fff;background:linear-gradient(180deg,rgba(7,7,12,.9),rgba(7,7,12,0));text-shadow:0 0 8px #8a55ff}
  .mtitle small{display:block;font-size:10px;letter-spacing:2px;color:#c8c0ff;font-weight:400;margin-top:2px}
  .back{position:absolute;left:10px;top:12px;padding:5px 10px!important}
  .nd{position:absolute;width:18px;height:18px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #c8c0ff;background:#2b1f63;box-shadow:0 0 6px #8a55ff;cursor:pointer;display:grid;place-items:center;font-size:9px;color:#fff;font-weight:700}
  .nd.chief{width:24px;height:24px;margin:-14px 0 0 -14px;border-color:#ffd77a;background:#6a2a10;box-shadow:0 0 8px #ff8a2a}
  .nd.clr{background:#c89a2a;border-color:#ffe8a0}.nd.lock{opacity:.45;border-color:#666;background:#1a1a22;box-shadow:none;cursor:default}
  .nd.cur{animation:pulse 1s infinite}.nd.sel{outline:2px solid #fff;outline-offset:2px}
  #nav{position:absolute;left:0;right:0;bottom:0;height:52px;z-index:40;display:none;background:linear-gradient(180deg,rgba(14,10,30,.96),rgba(6,5,14,.99));border-top:1px solid rgba(170,140,255,.45)}
  #nav.on{display:flex}#nav div{flex:1;display:grid;place-items:center;font-size:12px;letter-spacing:2px;color:#9a94c0;cursor:pointer}#nav div.on{color:#fff;text-shadow:0 0 8px #b48cff;background:rgba(90,60,180,.25)}
  #acct{position:absolute;left:0;right:0;top:0;height:54px;z-index:3;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(180deg,rgba(7,7,14,.95),rgba(7,7,14,.6))}
  #acct .lv{width:38px;height:38px;border-radius:50%;border:2px solid #e8b33a;display:grid;place-items:center;font-weight:900;color:#ffd77a;background:#1a1230}
  #acct .xp{flex:1}#acct .xp i{display:block;height:5px;background:#2a2244;margin-top:4px}#acct .xp b{display:block;height:100%;background:linear-gradient(90deg,#8a55ff,#e8b33a)}
  #acct .pw{font-size:11px;color:#ffd77a;text-align:right}
  #hubView{position:absolute;left:0;right:0;top:54px;bottom:52px;overflow-y:auto;padding:10px 12px 14px;box-sizing:border-box;color:#d8d4f0;font-size:12px}
  .hero{position:relative;height:300px}.hero canvas.art{position:absolute;left:50%;top:0;width:260px;height:260px;margin-left:-130px;filter:drop-shadow(0 0 12px rgba(140,90,255,.6))}
  .hero .slot{position:absolute;width:46px;height:46px;border:2px solid #3a3260;background:rgba(14,12,30,.85);border-radius:6px;display:grid;place-items:center;cursor:pointer}
  .hero .slot canvas,.bag canvas{width:36px;height:36px;image-rendering:pixelated}.slot small{position:absolute;bottom:-14px;font-size:9px;color:#8a84b0;white-space:nowrap}
  .hname{text-align:center;font-size:18px;font-weight:900;letter-spacing:4px;color:#fff;margin-top:6px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:10px 0;padding:8px 10px;background:rgba(20,16,40,.7);border:1px solid rgba(170,140,255,.25)}
  .stats em{color:#ffd77a;font-style:normal;float:right}
  .sets{margin:6px 0;padding:6px 10px;background:rgba(20,16,40,.7);border-left:3px solid #e8b33a;line-height:1.7}.sets .off{color:#6a6490}
  .bag{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.bag .it{position:relative;aspect-ratio:1;border:2px solid #333;background:rgba(14,12,30,.85);display:grid;place-items:center;cursor:pointer;border-radius:5px}
  .bag .it.eq::after{content:'E';position:absolute;right:2px;top:0;font-size:9px;color:#ffd77a}
  .itip{margin-top:10px;padding:10px;background:rgba(10,8,22,.95);border:1px solid rgba(170,140,255,.45);line-height:1.7}.itip .b{min-width:0;padding:6px 14px;font-size:12px;letter-spacing:1px;margin:6px 6px 0 0}
  .party{display:flex;gap:10px;justify-content:center;margin:12px 0}.party .pm{width:96px;height:120px;border:2px dashed #4a4270;border-radius:8px;display:grid;place-items:center;text-align:center;cursor:pointer}
  .party .pm canvas{width:64px;height:64px;image-rendering:pixelated}
  .bigbtn{display:block;width:100%;margin-top:10px;padding:12px 0;font-size:16px;letter-spacing:6px;color:#fff;background:linear-gradient(90deg,#4a2590,#8a3ac0);border:1px solid #c8a8ff;cursor:pointer;font-family:inherit}
  #raidTabs{position:absolute;left:0;right:0;top:64px;display:flex;gap:6px;overflow-x:auto;padding:0 10px 6px;z-index:3;scrollbar-width:none}

// 特效贴图去“方框”：GPT 的黑底有底噪，压掉弱透明度并让四边渐隐
function cleanFx(c,cut=48){const x=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height,d=x.getImageData(0,0,w,h),a=d.data,m=w*.14;
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){const p=(y*w+i)*4+3,e=Math.min(1,Math.min(i,y,w-1-i,h-1-y)/m);a[p]=Math.max(0,(a[p]-cut)*255/(255-cut))*e*e;}

function darkBox(cv){const w=cv.width,h=cv.height,d=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;let t=h,b=-1,sx=0,n=0;   // 返回 h 高度、b 脚底、t 头顶、cx 重心
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const p=(y*w+x)*4;if(d[p+3]>200&&d[p]+d[p+1]+d[p+2]<160){if(y<t)t=y;if(y>b)b=y;sx+=x;n++;}}return n>20?{h:b-t+1,b,t,cx:sx/n}:null;}
const med=a=>{const v=a.slice().sort((x,y)=>x-y);return v[v.length>>1];};
function refit(f,box,ref,kk){if(!box)return f;const k=kk||Math.min(1.35,Math.max(.75,ref.h/box.h)),c=document.createElement('canvas');c.width=f.width;c.height=f.height;c.isArt=true;
  c.getContext('2d').drawImage(f,ref.cx-box.cx*k,ref.b-box.b*k,f.width*k,f.height*k);return c;}
// 第二姿势按原姿势的描边尺寸 / 脚底 / 重心对齐（结果缓存在帧上）
function fitPose(f,base){if(!f||!base)return f;if(!f._fit){const a=darkBox(f),b=darkBox(base);f._fit=a&&b?refit(f,a,b):f;}return f._fit;}
function rowFit(fr,ref){const bs=fr.map(darkBox).filter(Boolean);if(!bs.length)return fr;const box={h:med(bs.map(q=>q.h)),b:med(bs.map(q=>q.b)),cx:med(bs.map(q=>q.cx))};return fr.map(f=>refit(f,box,ref));}
function normAnim(id){const C=CLS[id],a=C._anim;if(!a)return;const wb=a.slice(0,4).map(darkBox);if(wb.some(q=>!q)){C.art={idle:[a[0]],walk:a.slice(0,4),atk:a.slice(4),anim:true};return;}
  const ref={h:med(wb.map(q=>q.h)),b:med(wb.map(q=>q.b)),cx:med(wb.map(q=>q.cx))},walk=a.slice(0,4).map((f,i)=>refit(f,wb[i],ref,1));   // 走路帧不逐帧缩放，只对齐脚底与重心
  C.art={idle:[walk[0]],walk,atk:rowFit(a.slice(4),ref),anim:true};
  const d=C._dir;if(d)for(const[k,o]of[['down',0],['up',8]]){const w=d.slice(o,o+4),bs=w.map(darkBox);const kk=bs.every(Boolean)?Math.min(1.35,Math.max(.75,ref.h/med(bs.map(q=>q.h)))):1,mt=bs.every(Boolean)?med(bs.map(q=>q.t)):0,mb=bs.every(Boolean)?med(bs.map(q=>q.b)):0;
    // 正面/背面走路按头顶对齐（GPT 的背面走路帧上下起伏，按脚底对齐会像在跳）
    C.art[k]={walk:w.map((f,i)=>bs[i]?refit(f,{h:bs[i].h,b:bs[i].t+(mb-mt),cx:bs[i].cx},ref,kk):f),atk:rowFit(d.slice(o+4,o+8),ref)};}
  if(C._combo)C.combo=[rowFit(C._combo.slice(0,4),ref),rowFit(C._combo.slice(4),ref)];
  if(C._combo&&C._dir){C._anim=C._combo=C._dir=null;}}   // 三张图都对齐完就丢掉原始帧，省内存

function deco(c,kind,x,y,w,h,r){
  const R=(col,a,b,ww,hh)=>{c.fillStyle=col;c.fillRect(a|0,b|0,ww,hh);},n=Math.round(w*h/1400);
  for(let i=0;i<n;i++){const px=x+6+r()*(w-12),py=y+6+r()*(h-12),k=r();
    switch(kind){
      case'lava':if(k<.35){let cx=px,cy=py;for(let j=0;j<6;j++){R('#ff6a2a',cx,cy,2,1);cx+=r()*4-1;cy+=r()*3-1.5;}}
        else if(k<.5){R('#7a2410',px-4,py-2,9,5);R('#ff6a2a',px-3,py-1,7,3);R('#ffd34a',px-1,py,3,1);}else R('#2a1210',px,py,2,1);break;
      case'fire':if(k<.3){R('#1a0e08',px-3,py-2,7,4);}else if(k<.55){let cx=px,cy=py;for(let j=0;j<4;j++){R('#c0501a',cx,cy,2,1);cx+=r()*3;cy+=r()*2-1;}}else R('#ff9a4a',px,py,1,1);break;
      case'bones':if(k<.4){R('#cfcab8',px,py,4,1);R('#cfcab8',px,py-1,1,1);R('#cfcab8',px+3,py+1,1,1);}else if(k<.55){R('#cfcab8',px,py,3,3);R('#14121c',px,py+1,1,1);R('#14121c',px+2,py+1,1,1);}else R('#1a1a1e',px-3,py-2,7,4);break;
      case'blood':if(k<.45){R('#5a1418',px-3,py-2,6,4);R('#7a1a20',px-2,py-1,3,2);}else if(k<.6){R('#6a6a72',px,py-6,1,6);R('#9a9aa2',px-1,py,3,1);}else R('#3a1416',px,py,2,1);break;
      case'plague':if(k<.4){R('#2a4a1e',px-4,py-2,9,4);R('#6aa83a',px-2,py-1,4,1);R('#a6ec6c',px,py-1,1,1);}else if(k<.55){R('#5a5f6a',px,py-5,4,6);R('#3a3e48',px,py,4,1);R('#7a808a',px+1,py-4,2,1);}else R('#4a6a3a',px,py,2,1);break;

function telHit(t,x,y,m=0){switch(t.t){
  case'circle':return Math.hypot(x-t.x,y-t.y)<t.r+m;
  case'beam':{const ux=Math.cos(t.a),uy=Math.sin(t.a);return Math.abs(-(x-t.x)*uy+(y-t.y)*ux)<t.w+m;}
  case'cone':{const d=Math.hypot(x-t.x,y-t.y);if(d>t.len+m)return false;let da=Math.atan2(y-t.y,x-t.x)-t.a;da=Math.abs(Math.atan2(Math.sin(da),Math.cos(da)));return da<t.ang+m/Math.max(d,1);}
  case'rect':return x>t.x-m&&x<t.x+t.w+m&&y>t.y-m&&y<t.y+t.h+m;}
  return false;}
const rayNear=(b,a,x,y,w)=>{const ux=Math.cos(a),uy=Math.sin(a),px=x-b.x,py=y-b.y;return px*ux+py*uy>0&&Math.abs(-px*uy+py*ux)<w;};

    if(!t.harmless){if(t.t==='circle')rings.push({x:t.x,y:t.y,r0:3,r1:t.r,t:.3,T:.3,col:t.col==='i'?'#9fe8ff':'#ff6a6a'});

        if(t.eff==='dot'){G.dotT=6;G.dotD=pl.maxHp*.025;}if(t.eff==='fear'){G.fearT=1.3;G.fearA=angTo(b,pl);toast('恐惧！');}
        if(t.eff==='knock'){const a=angTo(b,pl);pl.x+=Math.cos(a)*45;pl.y+=Math.sin(a)*45;clampRoom(pl,4);}if(window.applyEffX)applyEffX(t,b);}}
    if(t.after)t.after();}
  if(!b.sec)b.tels=b.tels.filter(t=>!t.done||t.fx>0);
  if(b.mode==='walk'){if(!b.frozenT)chase(b,b.spd*(b.ph2?1.4:1)*(b.slowT>0?1-st.slow*.5:1),dt);
    if(b.at<=0){const s=b.sk[b.ph2?(rand()*b.sk.length)|0:b.cyc++%b.sk.length];b.mode=s;b.say={n:skName(b,s),t:1.4};skOf(b,s).start(b,f);}}
  else{const s=skOf(b,b.mode);if(s.tick)s.tick(b,dt,f);if(b.at<=0){endSkill(b);b.mode='walk';b.at=(b.big?1.3:1.6)*f;}}

function dmg(e,d,o={}){if(!e.dead&&!e.inv)sfx('hit');if(window.dmgMulX&&!e.dead){d*=dmgMulX(e,o);if(!d)return;}
  if(e.dead||e.inv)return;let crit=false;
  const cc=st.crit+(G.critBuffT>0?.5:0)+(G.songT>0?st.songCrit:0)+(G.critT>0&&o.src==='atk'?1:0);
  if(o.forceCrit||(!o.nocrit&&rand()<cc)){d*=st.critDmg;crit=true;}
  d*=G.pm;
  if(e.poison)d*=st.corrode;
  if(e.slowT>0)d*=st.slowBonus;
  if(e.frozenT>0&&st.shatter)d*=2;
  if(e.boss)d*=st.bossDmg;
  if(o.src==='atk'){if(st.rage&&pl.hp<pl.maxHp*.5)d*=1.6;if(st.shieldBash&&pl.shield>0)d*=1.4;}
  if(G.songT>0&&st.epicSong)d*=1.5;
  if(G.adrT>0)d*=2;
  if(o.src==='atk'&&G.sbN>0&&!o.splash)d*=1.6;
  if(st.soul&&o.src!=='atk')d*=1+.003*G.souls;   // 超凡邪恶只加技能伤害
  if(st.execDmg&&e.hp<e.max*.5)d*=1.4;if(st.rush&&G.rushT>0)d*=1.4;if(st.highHp&&pl.hp>pl.maxHp*.8)d*=1.3;if(G.mad===1)d*=1.4;
  e.hp-=d;e.flash=.08;G.dmgAcc+=d;G.roomDmg+=d;num(e.x,e.y-6,Math.round(d),crit?'#ffd34a':o.col||'#fff',crit);
  if(o.poison)e.poison=Math.min(st.poisonCap,e.poison+o.poison);
  if(o.src==='atk'&&st.vamp)pl.hp=Math.min(pl.maxHp,pl.hp+d*st.vamp);
  if(crit&&st.critSplash&&!o.splash)for(const x of en)if(x!==e&&!x.dead&&Math.hypot(x.x-e.x,x.y-e.y)<14)dmg(x,d*.5/G.pm,{nocrit:true,splash:true,col:'#ffd34a'});
  if(st.execute&&o.src==='atk'&&!e.boss&&e.hp>0&&e.hp<e.max*st.execute){e.hp=0;num(e.x,e.y-12,'斩','#ff6a6a',true);}
  if(e.hp<=0)kill(e);

function kill(e){if(e.silent)return;
  e.dead=true;G.kills++;sfx('kill');
  if(!e.boss&&e.def&&window.trashDeath)trashDeath(e);
  if(!e.boss){const ch=e.def?0:chOf(G.L);
    if(e.k==='SL'&&ch<4&&!e.small)for(let i=0;i<2;i++){const s2=spawnAt(e.x+(i?5:-5),e.y,'SL');s2.small=true;s2.hp=s2.max*=.4;s2.w=Math.round(s2.w*.7);s2.h=Math.round(s2.h*.7);s2.r=3;}
    if(e.k==='SL'&&ch===3&&G.pools.length<12)G.pools.push({x:e.x,y:e.y,r:10,arm:.3,t:3,tick:0,dmg:e.dmg*.5});
    if(e.k==='SK'&&(ch===1||ch===4))G.etels.push({t:'circle',x:e.x,y:e.y,r:16,left:.6,dmg:e.dmg*1.3,col:ch===1?'#ff8a2a':'#c060ff'});
    if(e.k==='SK'&&ch===3&&!e.revived)G.revives.push({x:e.x,y:e.y,t:2});}
  G.xp+=(e.boss?(e.big?40:18):ET[e.k].xp)*G.xpMul;
  if(st.killHeal)pl.hp=Math.min(pl.maxHp,pl.hp+st.killHeal);
  if(e.boss)for(let i=0;i<(e.big?5:3);i++)G.hearts.push({x:e.x+rand()*30-15,y:e.y+rand()*30-15,b:rand()*6});
  else if(e.k!=='SP'&&!e.small&&rand()<.035)G.hearts.push({x:e.x,y:e.y,b:rand()*6});
  if(st.killSword){const t=nearest(e.x,e.y,100,new Set([e]));if(t){const a=angTo(e,t);proj.push({x:e.x,y:e.y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,life:.8,pierce:2,hit:new Set([e]),dmg:st.swordDmg*1.5,src:'sword',kind:'sword',r:4,home:true});}}
  if(st.frenzy){G.frz=Math.min(15,G.frz+1);G.frzT=3;}
  if(st.soul)G.souls++;if(st.rush)G.rushT=3;if(st.killCd)G.skillT-=.3;if(st.killHealPct)pl.hp=Math.min(pl.maxHp,pl.hp+pl.maxHp*st.killHealPct);
  const A=atkBase();
  if(e.poison&&st.poisonBurst)G.booms.push({x:e.x,y:e.y,r:16,d:A*.8,eff:'poison'});
  if(e.burnT>0&&st.phoenix)G.booms.push({x:e.x,y:e.y,r:18*st.fireR,d:A*st.fireMul,eff:'fire'});
  if(e.frozenT>0&&st.shatter)G.booms.push({x:e.x,y:e.y,r:14,d:A*.6,eff:'ice'});
  if(e.k==='SP'){G.critBuffT=8;toast('孢子之力：暴击率 +50%');}
  if(e.boss&&e.big&&en.some(x=>x.boss&&!x.dead&&x!==e)){const nx=en.find(x=>x.boss&&!x.dead&&x!==e);if(G.boss===e){nx.sec=false;nx.tels=e.tels;G.boss=nx;}toast(`击败 ${e.name}，还剩 ${en.filter(x=>x.boss&&!x.dead).length} 个首领`);}
  else if(e.boss){G.boss=null;music('normal');G.bossDone=true;G.ultT=0;shots=[];G.pools=[];G.shake=.6;G.flash=.3;G.sealT=0;
    toast(`击败 ${e.name}`);}

function fireVfx(t){const v=t.vfx;
  if(t.t==='beam'){if(v==='breath')for(let k=-160;k<=160;k+=48)fxs('breathFire',t.x+Math.cos(t.a)*k,t.y+Math.sin(t.a)*k,0,.4,t.a,0,1.2,56,t.w*4);else fxs('beam',t.x,t.y,0,.4,t.a,0,1.3,800,t.w*4);}
  else if(t.t==='cone')fxs(v==='frostCone'?'breathFrost':'breathFire',t.x,t.y,0,.5,t.a,0,1.15,t.len,2*t.len*Math.sin(t.ang)+8,0);
  else if(t.t==='rect')for(let i=0;i<5;i++)fxs(v==='polarity'?'lightning':v==='spores'?'spores':'poisonPool',t.x+rand()*t.w,t.y+rand()*t.h,22,.6,0,0,1.2);
  else if(v==='erupt'||v==='submerge')fxs('lavaPillar',t.x,t.y-22,48,.5,0,0,1.1);
  else if(v==='frostblast'){fxs('frostCircle',t.x,t.y,(t.r||20)*2.2,.5,0,0,1.1);fxs('ice',t.x,t.y,(t.r||20)*1.6);}
  else if(v==='summon')fxs('portal',t.x,t.y,30,.7,0,3,1.2);
  else if(t.t==='circle'){fxs('quake',t.x,t.y,(t.r||20)*2.2,.45,0,0,1.1);fxs('rock',t.x,t.y-6,18,.3,0,0,1.3);}
  if(t.t==='beam'){const ux=Math.cos(t.a),uy=Math.sin(t.a),c=v==='breath'?'#ff9a4a':'#ffd0d0';for(let k=-160;k<=160;k+=14)burst(t.x+ux*k,t.y+uy*k,2,c,40,.4,1.5);return;}
  if(t.t==='cone'){const ice=v==='frostCone';for(let i=0;i<46;i++){const a=t.a+(rand()*2-1)*t.ang,sp=120+rand()*110;
    G.parts.push({x:t.x,y:t.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.5,T:.5,col:ice?(rand()<.5?'#bff4ff':'#6fb8ff'):(rand()<.5?'#ffd34a':'#ff6a2a'),s:2});}return;}
  if(t.t==='rect'){const pol=v==='polarity';for(let i=0;i<26;i++){const x=t.x+rand()*t.w,y=t.y+rand()*t.h;burst(x,y,1,pol?'#9fe8ff':(rand()<.5?'#a6ec6c':'#4a7a2a'),20,.7,2,pol?0:45);}
    if(pol)for(let i=0;i<3;i++){const x=t.x+rand()*t.w;bolts.push({pts:jag([[x,t.y],[x+rand()*20-10,t.y+t.h]]),t:.25});}return;}
  if(v==='erupt'||v==='submerge'){G.beams.push({x:t.x-5,y:t.y-50,w:10,h:52,t:.35,T:.35,col:'#ff8a2a',spr:'lavaPillar'});burst(t.x,t.y,16,'#ff9a4a',50,.7,1.5,60,60);return;}
  if(v==='frostblast'){burst(t.x,t.y,20,'#bff4ff',110,.45,1.5);return;}
  if(v==='summon'){burst(t.x,t.y,24,'#c99bff',80,.5,1.5);return;}

function avail(t,ex=[]){return HEX.filter(h=>h.tier===t&&fits(h)&&(!h.req||h.req())&&!G.owned.has(h.id)&&!ex.includes(h.id));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(rand()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickW(list,n){const out=[],a=list.slice();
  while(out.length<n&&a.length){const w=a.map(h=>h.tag==='通用'?.5:(1+(G.tags[h.tag]||0)*1.5)*(h.cls?2:1));let r=rand()*w.reduce((x,y)=>x+y,0),i=0;
    while(i<a.length-1&&(r-=w[i])>0)i++;const h=a.splice(i,1)[0];out.push(h);
    if(h.tag==='通用')for(let k=a.length-1;k>=0;k--)if(a[k].tag==='通用'&&a.length>n-out.length)a.splice(k,1);}
  return out;}
function rollTier(lvl){
  const w=[Math.max(25,70-lvl*3),22+lvl,4+lvl*1.5];
  let ok=[1,2,3].filter(t=>avail(t).length>=3);if(!ok.length)ok=[1,2,3].filter(t=>avail(t).length);if(!ok.length)return 0;
  let r=rand()*ok.reduce((s,t)=>s+w[t-1],0);for(const t of ok)if((r-=w[t-1])<=0)return t;return ok[ok.length-1];
}

  const it=e.target.closest('.it');if(it){showItem(+it.dataset.id);return;}
  const act=e.target.dataset.act;if(act&&HUB.sel){const x=PROG.inv.find(q=>q.id===HUB.sel);
    if(act==='on')PROG.eq[x.slot]=x.id;if(act==='off')delete PROG.eq[x.slot];
    if(act==='del'){if(PROG.eq[x.slot]===x.id)delete PROG.eq[x.slot];PROG.inv=PROG.inv.filter(q=>q!==x);HUB.sel=null;}
    saveProg();renderHub('bag');return;}
  const pm=e.target.closest('[data-pi]');if(pm){const i=+pm.dataset.pi;if(PROG.party[i]){PROG.party.splice(i,1);saveProg();renderHub('party');return;}
    $('partyPick').innerHTML=`<div class="classes">${CLS_IDS.filter(c=>c!==selCls&&!PROG.party.includes(c)).map(c=>`<div class="cls" data-addp="${c}">${CLS[c].n}</div>`).join('')}</div>`;return;}
  const ap=e.target.closest('[data-addp]');if(ap&&PROG.party.length<2){PROG.party.push(ap.dataset.addp);saveProg();renderHub('party');}});$('clsBack').onclick=()=>show('levels');
const setBtns=()=>{$('sndB').textContent='音效：'+(AU.muted?'关':'开');$('shkB').textContent='镜头震动：'+(SHAKE?'开':'关');};
$('sndB').onclick=()=>{toggleMute();setBtns();};$('shkB').onclick=()=>{SHAKE=!SHAKE;try{localStorage.setItem('abyss-shake',SHAKE?'1':'0');}catch(e){}setBtns();};setBtns();


// ---------- 输入 ----------
const phone=$('phone');
function toPhone(e){const r=phone.getBoundingClientRect(),s=r.width/390;return[(e.clientX-r.left)/s,(e.clientY-r.top)/s];}
phone.addEventListener('pointerdown',e=>{
  if(e.target.closest('#pick,#dead,#start,#ad,#home,#levels'))return;
  if(e.target.closest('#muteB')){toggleMute();return;}
  if(e.target.closest('#hexB,#hexV')){toggleHexV();return;}
  if(e.target.closest('#ult')){castUlt();return;}
  if(!G||G.state!=='play'||joy.id!==null)return;
  const[x,y]=toPhone(e);joy.id=e.pointerId;joy.ox=x;joy.oy=y;
  const j=$('joy');j.style.left=x+'px';j.style.top=y+'px';j.classList.add('act');
});
addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;const[x,y]=toPhone(e);let dx=x-joy.ox,dy=y-joy.oy;const l=Math.hypot(dx,dy);
  if(l>34){dx*=34/l;dy*=34/l;}joy.x=dx/34;joy.y=dy/34;$('knob').style.transform=`translate(${dx}px,${dy}px)`;});
function endJoy(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;$('knob').style.transform='';
  const j=$('joy');j.style.left='195px';j.style.top='600px';j.classList.remove('act');}
addEventListener('pointerup',endJoy);addEventListener('pointercancel',endJoy);
// 选卡：按下和抬起在同一张卡上即生效（一次点击）；战斗中手指拖到弹窗上松开不会误选
const pickKey=e=>{const c=e.target.closest('[data-i],[data-r]');return c?(c.dataset.i!==undefined?'i'+c.dataset.i:'r'+c.dataset.r):'';};
$('pick').addEventListener('pointerdown',e=>{G.pickDown=pickKey(e);});
$('pick').addEventListener('pointerup',e=>{const k=pickKey(e);if(!k||k!==G.pickDown)return;G.pickDown='';
  if(k[0]==='i')choose(+k.slice(1));else reroll(+k.slice(1));});
$('dead').addEventListener('click',e=>{
  if(e.target.id==='again'){$('dead').classList.remove('on');startGame();}
  if(e.target.id==='next'){$('dead').classList.remove('on');selLevel=G.L+1;startGame();}
  if(e.target.id==='home2'){$('dead').classList.remove('on');G=null;music(null);show('hub','hero');}
  if(e.target.id==='rev')showAd(()=>{G.revived=true;pl.hp=pl.maxHp;music(G.boss?'boss':'normal');pl.inv=2;$('dead').classList.remove('on');G.state='play';nova(80,atkBase()*3);});
});
function setIcons(){const f=ART.icons,i=CLS_IDS.indexOf(selCls);if(!f)return;
  for(const[id,ic,k]of[['skill','skIc',0],['ult','ulIc',1]]){$(ic).style.backgroundImage=`url(${f[i*2+k].toDataURL()})`;$(id).classList.add('hasic');}}
function startGame(){for(const k of SCREENS)$(k).classList.remove('on');$('nav').classList.remove('on');reset();$('hexN').textContent=G.owned.size;$('hexV').classList.remove('on');
  const C=CLS[selCls],a=$('ava'),ac=a.getContext('2d');if(C.port){a.width=a.height=64;ac.clearRect(0,0,64,64);ac.drawImage(C.port,0,0,64,64);}else{a.width=16;a.height=14;ac.clearRect(0,0,16,14);ac.drawImage(C.img[0],0,0);}
  const p=$('por'),pc=p.getContext('2d'),an=ART.anime&&ART.anime[CLS_IDS.indexOf(selCls)];p.style.imageRendering=an?'auto':'';   // 大招特写：动漫立绘（非像素）
  if(an){p.width=p.height=an.width;pc.clearRect(0,0,p.width,p.height);pc.drawImage(an,0,0);}else if(C.port){p.width=p.height=64;pc.drawImage(C.port,0,0,64,64);}else{p.width=18;p.height=18;pc.clearRect(0,0,18,18);pc.drawImage(C.bust,2,1);}
  $('cutSub').textContent=`${C.n} · 终极技能`;$('cutName').textContent=C.ult;$('skTx').textContent=C.sk.slice(0,2);setIcons();
  auInit();music('normal');}
$('go').onclick=startGame;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
  if(!G)return;if(k==='j'||k===' ')castSkill();if(k==='k')castUlt();
  if(G.state==='pick'&&'123'.includes(k))choose(+k-1);});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
$('muteB').classList.toggle('off',AU.muted);
const fit=()=>phone.style.transform=`scale(${Math.min(innerWidth/390,innerHeight/693)})`;fit();addEventListener('resize',fit);

// self-check：每个流派 2 稀有 / 2 史诗 / 1 传说；每个职业 3 张专属；每轮三张同品质且不重复；首领技能都存在且组合不重复
for(const t of ['暴击','雷电','毒伤','召唤','护盾','连击','吸血','剑阵','火焰','冰霜'])for(const ty of ['melee','ranged'])console.assert([2,2,1].every((n,i)=>HEX.filter(h=>h.tag===t&&!h.cls&&(!h.only||h.only===ty)&&h.tier===i+1).length===n),'tag tiers',t,ty);
for(const c of CLS_IDS){console.assert(HEX.filter(h=>h.cls===c).length===5,'class cards',c);const ty=AT[CLS[c].atk].melee?'melee':'ranged';
  for(const t of CLS[c].specs)console.assert([2,2,1].every((n,i)=>HEX.filter(h=>h.tag===t&&(!h.cls||h.cls===c)&&(!h.only||h.only===ty)&&h.tier===i+1).length===n),'spec tiers',c,t);}
for(const c of CLS_IDS)console.assert([1,2,3].every(t=>GEN.some(g=>g[1]===t&&(g[0]==='all'||g[0].includes(CLS[c].role)))),'gen pool',c);
for(const c of CLS_IDS)if(c!=='sword')console.assert(!CLS[c].specs.includes('剑阵'),'sword cards leak',c);
for(const d of BIG.concat(MINI))console.assert(d.sk.every(s=>SK[s]),'boss skill',d.n);
console.assert(new Set(BIG.concat(MINI).map(d=>d.sk.slice().sort().join())).size===24,'unique boss kits');
selCls='mage';reset();
for(let i=0;i<300;i++){const o=makeOffer(1+i%15);console.assert(o.cards.length===3&&o.cards.every(h=>h.tier===o.tier)&&new Set(o.cards.map(h=>h.id)).size===3,'offer',o);}
G=null;show('home');
if(Q.has('lv')||Q.has('boss')){show('start');}
requestAnimationFrame(frame);
</script>
