<script>
const $=id=>document.getElementById(id);
const W=195,H=347,FL={x0:12,y0:54,x1:183,y1:328};
const rand=Math.random,TAU=Math.PI*2;

// ---------- 像素素材 ----------
const P={W:'#ece7d2',S:'#a39d88',K:'#14121c',G:'#5fcf5a',L:'#c4f7a6',D:'#2f8a3b',P:'#8a55cc',Q:'#4a2a78',

const SPR={

      ["....bBBb....","...bBlBBb...","..bBlBBBBb..","..bBFFFFBb..","..bFKFFKFb..","..bFFffFFb..","...rrrrrr.C.",
       "..bBBlBBBbC.",".bBBBlBBBBC.",".FbBYYYYBFYY","..bBBBBBBbZ.","..bBBbbBBb..","..ZZ...ZZ...","..ZZ....ZZ.."]],
  SK:[["...WWWW...","..WWWWWWS.","..WRKWRKS.","..WWWWWWS.","...WKWKS..","....SS....","..SWWWWS.O",".W.WSSW.WO","...WWWW..O","....SS....","...W..W...","..WS..SW.."],
      ["...WWWW...","..WWWWWWS.","..WRKWRKS.","..WWWWWWS.","...WKWKS..","....SS....","..SWWWWS.O",".W.WSSW.WO","...WWWW..O","....SS....","..W...W...",".WS...SW.."]],
  SL:[["...GGGG...","..GLLGGG..",".GLGGGGGG.",".GGKGGKGG.","GGGKGGKGGG","GGGGGGGGGG","DGGGGGGGGD",".DDDDDDDD."],

};
// 大招特写用的半身像（原创角色“星澜”，占位）
const BUST=["...........C....",

function mk(rows,flash){
  const w=rows[0].length,h=rows.length,cv=document.createElement('canvas');cv.width=w+2;cv.height=h+2;const x=cv.getContext('2d');
  const on=(i,j)=>!!(rows[j]&&rows[j][i]&&rows[j][i]!=='.');
  for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){
    if(on(i,j))x.fillStyle=flash?'#fff':P[rows[j][i]];
    else if(on(i-1,j)||on(i+1,j)||on(i,j-1)||on(i,j+1))x.fillStyle='#0b0a12';

    x.fillRect(i+1,j+1,1,1);}
  return cv;}

const IMG={};for(const k in SPR){IMG[k]=SPR[k].map(r=>mk(r));IMG[k+'f']=SPR[k].map(r=>mk(r,true));}

function drawRoom(c){
  const rect=(col,x,y,w,h)=>{c.fillStyle=col;c.fillRect(x|0,y|0,w,h);};
  let s=11;const r=()=>(s=s*16807%2147483647)/2147483647;
  const T=15;
  for(let y=0;y<H;y+=T)for(let x=0;x<W;x+=T){

    rect('#23253a',x+T-1,y,1,T);rect('#23253a',x,y+T-1,T,1);
    if(r()<.25)rect('#24263a',x+3+r()*8,y+3+r()*8,3,1);

  }
  rect('#15172a',0,0,W,16);rect('#4a4f6c',0,15,W,1);
  for(let y=16;y<46;y+=5){rect('#2a2d42',0,y,W,5);for(let x=0;x<W;x+=12)rect('#3a3e58',x+((y/5|0)%2)*6+1,y+1,10,4);}
  rect('#14151f',0,46,W,2);rect('rgba(0,0,0,.25)',0,48,W,3);
  rect('#15172a',0,0,9,H);rect('#4a4f6c',8,16,1,H-30);
  rect('#15172a',W-9,0,9,H);rect('#4a4f6c',W-9,16,1,H-30);
  rect('#15172a',0,H-14,W,14);rect('#4a4f6c',8,H-14,W-16,1);
  const door=(x,y,w,h,v)=>{rect('#0c0d14',x,y,w,h);c.fillStyle='#9aa0c0';

function pushOut(b,r){let hit=null;
  for(const o of OBS){if(o.dead)continue;
    const l=b.x+r-o.x,rr=o.x+o.w-(b.x-r),t=b.y+r-o.y,bt=o.y+o.h-(b.y-r);
    if(l>0&&rr>0&&t>0&&bt>0){const m=Math.min(l,rr,t,bt);
      if(m===l)b.x-=l;else if(m===rr)b.x+=rr;else if(m===t)b.y-=t;else b.y+=bt;hit={o,ax:(m===l||m===rr)?'x':'y'};}}
  return hit;}
// 相邻的障碍（如并排木箱）合并成一块再找拐角，避免在缝隙间来回
function cluster(o){const b={x:o.x,y:o.y,w:o.w,h:o.h};let grew=true;
  while(grew){grew=false;for(const q of OBS){if(q.dead)continue;
    if(q.x<b.x+b.w+3&&q.x+q.w>b.x-3&&q.y<b.y+b.h+3&&q.y+q.h>b.y-3){const x2=Math.max(b.x+b.w,q.x+q.w),y2=Math.max(b.y+b.h,q.y+q.h),x=Math.min(b.x,q.x),y=Math.min(b.y,q.y);
      if(x<b.x||y<b.y||x2>b.x+b.w||y2>b.y+b.h){b.x=x;b.y=y;b.w=x2-x;b.h=y2-y;grew=true;}}}}

    e.wp={x:fx,y:Math.abs(a-py)+Math.abs(a-e.y)<Math.abs(b-py)+Math.abs(b-e.y)?a:b};}
  else{const fy=e.y<o.y+o.h/2?o.y-m:o.y+o.h+m,a=o.x-m,b=o.x+o.w+m;
    e.wp={x:Math.abs(a-px)+Math.abs(a-e.x)<Math.abs(b-px)+Math.abs(b-e.x)?a:b,y:fy};}

      if(m==='barrage'){b.mode='barrage';b.at=b.ph2?2.2:1.4;b.st=0;b.off=rand()*TAU;}
      if(m==='slam'){b.mode='slam';b.at=1.05*f;b.tel={t:'circle',x:pl.x,y:pl.y,r:26,T:1.05*f};}}
  }else if(b.mode==='aim'){if(b.at<=0){b.mode='charge';b.at=.6;b.tel=null;}}
  else if(b.mode==='charge'){
    b.x+=Math.cos(b.dir)*(160+n*20)*dt;b.y+=Math.sin(b.dir)*(160+n*20)*dt;
    if(b.x<FL.x0+8||b.x>FL.x1-8||b.y<FL.y0+8||b.y>FL.y1-8||pushOut(b,9)){b.at=0;G.shake=.2;}
    if(b.at<=0){b.mode='walk';b.at=1.4*f;}
  }else if(b.mode==='barrage'){
    if((b.st-=dt)<=0){if(b.ph2){b.st=.09-n*.01;b.off+=.33;ringShots(b,3,b.off,56+n*8);}else{b.st=.5;b.off+=.2;ringShots(b,16+n*2,b.off,52+n*8);}}
    if(b.at<=0){b.mode='walk';b.at=1.3*f;}
  }else if(b.mode==='slam'){
    if(b.at<=0){const t=b.tel;b.tel=null;b.mode='walk';b.at=1.3*f;G.shake=.35;
      rings.push({x:t.x,y:t.y,r0:4,r1:t.r,t:.35,T:.35,col:'#ff6a6a'});
      if(Math.hypot(pl.x-t.x,pl.y-t.y)<t.r){pl.inv=0;hurt(18+n*8);}
      for(let i=0;i<4+n*2;i++){const a=i*TAU/(4+n*2);spawnAt(t.x+Math.cos(a)*30,t.y+Math.sin(a)*30);}}
  }
  b.x=Math.max(FL.x0+6,Math.min(FL.x1-6,b.x));b.y=Math.max(FL.y0+6,Math.min(FL.y1-6,b.y));
  if(b.mode!=='charge'){const h=pushOut(b,9);if(h&&!b.wp)setWp(b,h,11);}
}

function num(x,y,v,col,big){if(nums.length<90)nums.push({x:x-4+rand()*4,y,s:String(v),col,big,t:.7});}
function dmg(e,d,o={}){
  if(e.dead)return;let crit=false;
  if(!o.nocrit&&rand()<st.crit){d*=st.critDmg;crit=true;}
  if(e.poison)d*=st.corrode;
  if(o.src==='atk'){if(st.rage&&pl.hp<pl.maxHp*.5)d*=1.6;if(st.shieldBash&&pl.shield>0)d*=1.4;}
  e.hp-=d;e.flash=.08;num(e.x,e.y-6,Math.round(d),crit?'#ffd34a':o.col||'#fff',crit);
  if(o.poison)e.poison=Math.min(12,e.poison+o.poison);
  if(o.src==='atk'&&st.vamp)pl.hp=Math.min(pl.maxHp,pl.hp+d*st.vamp);
  if(crit&&st.critSplash)for(const x of en)if(x!==e&&!x.dead&&Math.hypot(x.x-e.x,x.y-e.y)<14)dmg(x,d*.5,{nocrit:true,col:'#ffd34a'});
  if(st.execute&&o.src==='atk'&&!e.boss&&e.hp>0&&e.hp<e.max*st.execute){e.hp=0;num(e.x,e.y-12,'斩','#ff6a6a',true);}
  if(e.hp<=0)kill(e);
}
function kill(e){
  e.dead=true;G.kills++;sfx('kill');
  gems.push({x:e.x,y:e.y,v:ET[e.k].xp});
  if(e.poison&&st.poisonBurst)G.bursts.push({x:e.x,y:e.y,s:e.poison});
  if(e.boss){G.boss=null;music('normal');G.bossDone=true;G.ultT=0;G.bonusPick=true;shots=[];G.shake=.6;G.flash=.3;
    toast('击败骸骨领主 · 获得传说海克斯');
    for(let i=0;i<30;i++)gems.push({x:e.x+rand()*30-15,y:e.y+rand()*30-15,v:2});}
}
function hitCrate(o,d){o.hp-=d;o.flash=.08;
  if(o.hp<=0){o.dead=true;sfx('crate');rings.push({x:o.x+o.w/2,y:o.y+o.h/2,r0:2,r1:12,t:.25,T:.25,col:'#c48a4e'});
    for(let i=0;i<3;i++)gems.push({x:o.x+o.w/2+rand()*8-4,y:o.y+o.h/2+rand()*8-4,v:2});}}
function nearest(x,y,r,skip){let b=null,bd=r*r;for(const e of en){if(e.dead||(skip&&skip.has(e)))continue;const q=(e.x-x)**2+(e.y-y)**2;if(q<bd){bd=q;b=e;}}return b;}
function jag(pts){const out=[pts[0]];for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];
  for(let k=1;k<4;k++){const t=k/4;out.push([a[0]+(b[0]-a[0])*t+(rand()-.5)*6,a[1]+(b[1]-a[1])*t+(rand()-.5)*6]);}out.push(b);}return out;}
function chain(sx,sy,n,first,hop,d,skip){
  const hit=new Set(skip),pts=[[sx,sy]],out=[];let cx=sx,cy=sy,r=first;
  for(let k=0;k<n;k++){const b=nearest(cx,cy,r,hit);if(!b)break;hit.add(b);out.push(b);dmg(b,d*st.boltMul,{col:'#9ff6ff'});cx=b.x;cy=b.y;pts.push([cx,cy]);r=hop;}
  if(pts.length>1)bolts.push({pts:jag(pts),t:.22});return out;
}
function hurt(d){
  if(pl.inv>0)return;pl.inv=.7;G.sinceHurt=0;G.shake=.15;
  if(pl.shield>0){const a=Math.min(pl.shield,d);pl.shield-=a;d-=a;
    if(st.thorns&&G.thornT<=0){G.thornT=.4;rings.push({x:pl.x,y:pl.y,r0:4,r1:24,t:.3,T:.3,col:'#9fd8ff'});
      for(const e of en)if(!e.dead&&Math.hypot(e.x-pl.x,e.y-pl.y)<24)dmg(e,25,{nocrit:true,col:'#9fd8ff'});}
    if(pl.shield<=0&&st.shieldBreak){pl.inv=1.2;nova(45,20);}}

    else{pl.hp=0;die();}
  }
}
function nova(r,d){rings.push({x:pl.x,y:pl.y,r0:4,r1:r,t:.4,T:.4,col:'#c99bff'});
  for(const e of en){const dx=e.x-pl.x,dy=e.y-pl.y,q=Math.hypot(dx,dy);if(q<r){dmg(e,d,{nocrit:true});if(!e.boss){e.x+=dx/q*12||0;e.y+=dy/q*12||0;}}}
  shots=[];}

function castSkill(){
  if(G.state!=='play'||G.skillT>0)return;
  const hl=chain(pl.x,pl.y-2,st.chain,105,58,st.skillDmg);if(!hl.length)return;
  G.skillT=st.skillCd;G.shake=.12;sfx('zap');
  for(const t of hl){rings.push({x:t.x,y:t.y,r0:2,r1:16,t:.25,T:.25,col:'#9ff6ff'});
    for(const e of en)if(e!==t&&!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<16)dmg(e,st.skillDmg*.5*st.boltMul,{nocrit:true,col:'#9ff6ff'});}
}
function castUlt(){

function doUlt(){

    rain.push({x:e?e.x:FL.x0+rand()*170,y:e?e.y:FL.y0+rand()*270,delay:.1+i*.035,fall:.22});}

// ---------- 自动战斗：躲怪、躲 Boss 预警和弹幕，安全时去捡经验 ----------
function autoDir(){
  let vx=0,vy=0;
  for(const e of en){const dx=pl.x-e.x,dy=pl.y-e.y,d2=dx*dx+dy*dy;if(d2<60*60&&d2>1){const w=(e.boss?8:1)/d2;vx+=dx*w;vy+=dy*w;}}
  for(const o of shots){const dx=pl.x-o.x,dy=pl.y-o.y,d2=dx*dx+dy*dy;if(d2<30*30&&d2>1){const w=3/d2;vx+=dx*w;vy+=dy*w;}}
  const b=G.boss;
  if(b&&b.tel){const t=b.tel;
    if(t.t==='circle'){const dx=pl.x-t.x,dy=pl.y-t.y,d=Math.hypot(dx,dy)||1;if(d<t.r+8){vx+=dx/d*2;vy+=dy/d*2;}}
    else{const ux=Math.cos(t.a),uy=Math.sin(t.a),px=pl.x-b.x,py=pl.y-b.y,along=px*ux+py*uy,perp=-px*uy+py*ux;
      if(along>-10&&Math.abs(perp)<16){const s=perp>=0?1:-1;vx+=-uy*s*2;vy+=ux*s*2;}}}
  const wall=d=>d<24?(24-d)/24*.06:0;
  vx+=wall(pl.x-FL.x0)-wall(FL.x1-pl.x);vy+=wall(pl.y-FL.y0)-wall(FL.y1-pl.y);
  for(const o of OBS){if(o.dead)continue;const nx=Math.max(o.x,Math.min(pl.x,o.x+o.w)),ny=Math.max(o.y,Math.min(pl.y,o.y+o.h)),
    dx=pl.x-nx,dy=pl.y-ny,d=Math.hypot(dx,dy);if(d<10&&d>0){vx+=dx/d*(10-d)*.006;vy+=dy/d*(10-d)*.006;}}
  const m=Math.hypot(vx,vy),k=Math.min(1,m/.05);
  let tx=m?vx/m*k:0,ty=m?vy/m*k:0;
  // 越安全越倾向去捡经验；没经验就回房间中部，接近后停下
  let q=null,bd=80*80;for(const o of gems){const d=(o.x-pl.x)**2+(o.y-pl.y)**2;if(d<bd){bd=d;q=o;}}
  const gx=q?q.x:97,gy=q?q.y:200,dx=gx-pl.x,dy=gy-pl.y,d=Math.hypot(dx,dy),stop=q?0:16;
  if(d>stop){const s=Math.min(q?.9:.6,(d-stop)/(q?8:30))*(1-k);tx+=dx/d*s;ty+=dy/d*s;}
  return[tx,ty];
}

// ---------- 音频：全部用 Web Audio 现场合成（8-bit 风），无外部素材 ----------
const AU={ctx:null,master:null,mus:null,sfx:null,noise:null,muted:false,song:null,step:0,next:0,last:{}};
try{AU.muted=localStorage.getItem('abyss-mute')==='1';}catch(e){}
function auInit(){
  if(AU.ctx){AU.ctx.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C();
  AU.master=c.createGain();AU.master.gain.value=AU.muted?0:1;AU.master.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=.16;AU.mus.connect(AU.master);
  AU.sfx=c.createGain();AU.sfx.gain.value=.32;AU.sfx.connect(AU.master);
  const n=c.sampleRate>>1,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=rand()*2-1;AU.noise=b;
  setInterval(schedule,25);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(t,f,dur,type,vol,out,f2){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.02);}
function noise(t,dur,vol,out,hp){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;
  f.type=hp?'highpass':'lowpass';f.frequency.value=hp||1200;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(out);s.start(t);s.stop(t+dur+.02);}
// 和弦进行：[根音 midi, 是否大三和弦]；地牢 Am-F-C-G，Boss Dm-B♭-Gm-A
const SONGS={normal:{bpm:118,ch:[[57,0],[53,1],[48,1],[55,1]]},boss:{bpm:158,ch:[[50,0],[46,1],[55,0],[57,1]]}};
function schedule(){
  const c=AU.ctx;if(!c||!AU.song)return;
  const S=SONGS[AU.song],sp=60/S.bpm/4,boss=AU.song==='boss';
  while(AU.next<c.currentTime+.12){
    const t=AU.next,k=AU.step%16,[root,maj]=S.ch[(AU.step>>4)%4],iv=[0,maj?4:3,7,12];
    if(boss?k%2===0:[0,3,6,8,11,14].includes(k))tone(t,mf(root-12),sp*1.6,'triangle',.5,AU.mus);
    tone(t,mf(root+12+iv[k%4]),sp*.9,'square',.09,AU.mus);
    if(k%8===0||(boss&&k%4===0))tone(t,150,.12,'sine',.7,AU.mus,40);
    if(k%8===4)noise(t,.12,.35,AU.mus,1500);
    if(k%2===0)noise(t,.03,.12,AU.mus,7000);
    AU.next+=sp;AU.step++;
  }
}
function music(name){if(!AU.ctx||AU.song===name)return;AU.song=name;AU.step=0;AU.next=AU.ctx.currentTime+.05;}
function sfx(k){
  const c=AU.ctx;if(!c||AU.muted)return;const t=c.currentTime,o=AU.sfx;
  const gap={shoot:.07,kill:.04,gem:.05,hurt:.15}[k];if(gap){if(t-(AU.last[k]||0)<gap)return;AU.last[k]=t;}
  switch(k){
    case'shoot':tone(t,900,.05,'square',.05,o,500);break;
    case'kill':tone(t,420,.06,'square',.08,o,180);break;
    case'gem':tone(t,1400,.04,'triangle',.07,o,1900);break;
    case'hurt':tone(t,240,.15,'sawtooth',.25,o,90);break;
    case'zap':tone(t,1600,.25,'sawtooth',.18,o,180);noise(t,.2,.25,o,3000);break;
    case'cutin':tone(t,220,.6,'sawtooth',.15,o,1400);tone(t,330,.6,'square',.08,o,2100);break;
    case'ult':tone(t,120,.9,'sawtooth',.4,o,30);noise(t,.8,.6,o);tone(t,60,.9,'sine',.8,o,25);break;
    case'lvl':[72,76,79,84].forEach((m,i)=>tone(t+i*.06,mf(m),.18,'triangle',.25,o));break;
    case'pick':tone(t,mf(79),.12,'square',.12,o);tone(t+.08,mf(86),.2,'square',.12,o);break;
    case'boss':tone(t,70,1.2,'sawtooth',.4,o,40);noise(t,1,.4,o);break;
    case'crate':noise(t,.12,.35,o);tone(t,180,.1,'square',.15,o,80);break;
    case'dead':[64,60,57,52].forEach((m,i)=>tone(t+i*.18,mf(m),.3,'triangle',.3,o));break;
  }
}
function toggleMute(){AU.muted=!AU.muted;if(AU.master)AU.master.gain.value=AU.muted?0:1;$('muteB').classList.toggle('off',AU.muted);
  try{localStorage.setItem('abyss-mute',AU.muted?'1':'0');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(AU.ctx)document.hidden?AU.ctx.suspend():AU.ctx.resume();});

// ---------- 主循环 ----------
const joy={x:0,y:0,id:null,ox:0,oy:0},keys={};
const minionPos=i=>{const a=G.t*1.2+i*TAU/Math.max(1,st.minions);return{x:pl.x+Math.cos(a)*13,y:pl.y-4+Math.sin(a)*7};};
function update(dt){
  G.t+=dt;
  let mx=joy.x+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0),my=joy.y+((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);
  const manual=joy.id!==null||mx||my;
  if(G.phase==='walk'||G.phase==='trans'){const t=pl.wp||EXIT,dx=t.x-pl.x,dy=t.y-pl.y,d=Math.hypot(dx,dy)||1;mx=dx/d;my=dy/d;
    if(pl.wp&&d<2.5)pl.wp=null;}
  else if(!manual){const[tx,ty]=autoDir(),a=Math.min(1,dt*10);pl.ax+=(tx-pl.ax)*a;pl.ay+=(ty-pl.ay)*a;mx=pl.ax;my=pl.ay;}
  else{pl.ax=mx;pl.ay=my;}
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  const spd=st.speed*(st.rage&&pl.hp<pl.maxHp*.5?1.2:1);
  pl.x=Math.max(FL.x0,Math.min(FL.x1,pl.x+mx*spd*dt));pl.y=Math.max(FL.y0,Math.min(FL.y1,pl.y+my*spd*dt));
  {const h=pushOut(pl,3);if(h&&G.phase==='walk'&&!pl.wp)setWp(pl,h,5,EXIT.x,EXIT.y);}
  if(Math.abs(mx)>.25)pl.face=mx<0?-1:1;pl.moving=ml>.15;
  pl.inv-=dt;G.sinceHurt+=dt;G.thornT-=dt;
  if(st.shieldMax&&G.sinceHurt>2.5)pl.shield=Math.min(st.shieldMax,pl.shield+st.shieldMax*.35*dt);

  // 关卡流程：刷完本关定额 → 清空 → 吸经验、开门 → 自动走出上门 → 进入下一关
  const c=G.cfg;
  if(G.phase==='fight'){
    if(c.boss&&!G.boss&&!G.bossDone&&(c.bossDelay-=dt)<=0){G.bossN=Math.ceil(G.stage/5)-1;spawnBoss();}
    if(G.spawned<c.quota){
      G.spawnAcc+=dt*c.rate*(G.boss?.6:1);
      while(G.spawnAcc>=1&&G.spawned<c.quota&&en.length<380){G.spawnAcc--;const d=DOORS[(rand()*3)|0];spawnAt(d[0]+rand()*10-5,d[1]+rand()*6-3);G.spawned++;}
      if(!c.boss&&G.stage>1&&(c.waveT-=dt)<=0){c.waveT=15;const n=Math.min(c.quota-G.spawned,8+G.stage*3);
        for(let i=0;i<n;i++){const a=rand()*TAU,r=55+rand()*35;
          spawnAt(Math.max(FL.x0,Math.min(FL.x1,pl.x+Math.cos(a)*r)),Math.max(FL.y0,Math.min(FL.y1,pl.y+Math.sin(a)*r)));}
        G.spawned+=n;if(n){$('banner').textContent='怪潮来袭';banner();}}}
    if(c.boss?G.bossDone:(G.spawned>=c.quota&&!en.length)){
      for(const e of en)if(!e.dead)kill(e);
      G.phase='clear';G.phaseT=1.2;shots=[];$('banner').textContent='清除！';banner();sfx('lvl');}
  }else if(G.phase==='clear'){if((G.phaseT-=dt)<=0&&!gems.length){G.phase='walk';G.phaseT=6;}}
  else if(G.phase==='walk'){if((pl.y<=FL.y0+1&&Math.abs(pl.x-EXIT.x)<12)||(G.phaseT-=dt)<=0){G.phase='trans';G.phaseT=.45;$('fade').classList.add('on');}}
  else if(G.phase==='trans'&&(G.phaseT-=dt)<=0){G.stage++;startStage();$('fade').classList.remove('on');}

  for(const e of en){
    if(e.dead)continue;
    if(e.poison&&(e.pt-=dt)<=0){e.pt=.5;dmg(e,2*e.poison*st.poisonMul*(st.plague?2:1),{nocrit:true,col:'#a6ec6c'});
      if(st.plague&&rand()<.3){const o=nearest(e.x,e.y,18,new Set([e]));if(o&&!o.poison)o.poison=2;}}
    e.flash-=dt;e.scd-=dt;
    if(e.boss)bossAI(e,dt);else{const dx=pl.x-e.x,dy=pl.y-e.y,q=Math.hypot(dx,dy)||1;
      if(e.k!=='SA'||q>70||e.wp)chase(e,e.spd,dt);
      if(e.k==='SA'&&q<95&&(e.shotT-=dt)<=0){e.shotT=2.6;shots.push({x:e.x,y:e.y,vx:dx/q*70,vy:dy/q*70,life:2,dmg:7,arrow:true});}}
    if(Math.hypot(pl.x-e.x,pl.y-e.y)<(e.r||5)+.5)hurt(e.dmg);
  }
  for(let i=0;i<en.length;i++){const a=en[i];for(let j=i+1;j<en.length;j++){const b=en[j];
    const dx=b.x-a.x,dy=b.y-a.y,q=dx*dx+dy*dy,m=(a.r||3)+(b.r||3);if(q<m*m&&q>0){const d=Math.sqrt(q),p=(m-d)/d;
      if(a.boss){b.x+=dx*p;b.y+=dy*p;}else if(b.boss){a.x-=dx*p;a.y-=dy*p;}else{a.x-=dx*p*.5;a.y-=dy*p*.5;b.x+=dx*p*.5;b.y+=dy*p*.5;}}}
    a.x=Math.max(FL.x0-2,Math.min(FL.x1+2,a.x));a.y=Math.max(FL.y0-2,Math.min(FL.y1+2,a.y));
    // 被障碍挡住时沿边绕行
    if(!a.boss){const h=pushOut(a,3);if(h&&!a.wp)setWp(a,h,5);}}

  // 自动普攻（+ 疾风连斩）
  if((G.atkT-=dt)<=0){const t=nearest(pl.x,pl.y,120);if(t){G.atkT=st.atkCd*(st.rage&&pl.hp<pl.maxHp*.5?.7:1);G.atkN++;sfx('shoot');const base=Math.atan2(t.y-pl.y,t.x-pl.x);
    const fire=a=>proj.push({x:pl.x,y:pl.y-2,vx:Math.cos(a)*180,vy:Math.sin(a)*180,life:.8,pierce:st.pierce,hit:new Set(),dmg:st.atkDmg,src:'atk'});

    for(let i=0;i<st.swordShots;i++){const a=base+(i-(st.swordShots-1)/2)*.3;
      proj.push({x:pl.x,y:pl.y-2,vx:Math.cos(a)*200,vy:Math.sin(a)*200,life:.8,pierce:4,hit:new Set(),dmg:st.swordDmg*1.5,src:'sword'});}
    if(st.comboNova&&G.atkN%5===0)for(let i=0;i<12;i++)fire(i*TAU/12);
    if(st.storm&&G.atkN%4===0){const tg=en.filter(e=>!e.dead);
      for(let i=0;i<5&&tg.length;i++){const e=tg.splice((rand()*tg.length)|0,1)[0];bolts.push({pts:jag([[e.x+rand()*10-5,e.y-80],[e.x,e.y]]),t:.25});dmg(e,(30+st.atkDmg)*st.boltMul,{src:'atk'});}}}}
  // 星灵
  for(let i=0;i<st.minions;i++){if(G.mcd[i]===undefined)G.mcd[i]=rand()*.5;if((G.mcd[i]-=dt)<=0){const m=minionPos(i),t=nearest(m.x,m.y,110);
    if(t){G.mcd[i]=st.minionCd;const a=Math.atan2(t.y-m.y,t.x-m.x);
      proj.push({x:m.x,y:m.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,life:.9,pierce:st.minionPierce,hit:new Set(),dmg:st.atkDmg*st.minionMul,src:'atk',min:true});}}}
  for(const p of proj){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    const o=solidAt(p.x,p.y);if(o){p.life=0;if(o.kind==='crate')hitCrate(o,p.dmg);continue;}
    for(const e of en){if(e.dead||p.hit.has(e))continue;if(Math.abs(e.x-p.x)<(e.r||5)&&Math.abs(e.y-p.y)<(e.r||5)){p.hit.add(e);
      dmg(e,p.dmg,{poison:p.src==='atk'?st.poisonOnHit:0,src:p.src});
      if(p.src==='atk'){const hops=st.atkChain+(rand()<st.boltChance?3:0);if(hops)chain(e.x,e.y,hops,40,40,st.atkDmg*.6,[e]);}

  proj=proj.filter(p=>p.life>0);

  G.skillT-=dt;G.ultT-=dt;G.energy=Math.max(0,Math.min(100,(1-G.ultT/ULT_CD)*100));
  if(G.phase==='fight'&&G.skillT<=0&&nearest(pl.x,pl.y,100))castSkill();

  for(let n=0;G.bursts.length&&n<40;n++){const b=G.bursts.shift();rings.push({x:b.x,y:b.y,r0:2,r1:16,t:.3,T:.3,col:'#a6ec6c'});

  for(const r of rain){if((r.delay-=dt)>0)continue;if((r.fall-=dt)<=0){r.done=1;G.shake=Math.max(G.shake,.12);
    rings.push({x:r.x,y:r.y,r0:2,r1:16,t:.25,T:.25,col:'#fff2c0'});for(const e of en)if(Math.hypot(e.x-r.x,e.y-r.y)<16)dmg(e,35*st.ultMul);}}
  rain=rain.filter(r=>!r.done);

  for(const o of shots){o.x+=o.vx*dt;o.y+=o.vy*dt;o.life-=dt;
    if(o.x<FL.x0-4||o.x>FL.x1+4||o.y<FL.y0-6||o.y>FL.y1+4||solidAt(o.x,o.y))o.life=0;
    if(Math.hypot(o.x-pl.x,o.y-pl.y)<3.5&&pl.inv<=0){o.life=0;hurt(o.dmg||10+G.bossN*4);}}
  shots=shots.filter(o=>o.life>0);

  for(const q of gems){const dx=pl.x-q.x,dy=pl.y-q.y,d=Math.hypot(dx,dy);
    if(d<(G.phase==='fight'?st.pickup:999)){const v=G.phase==='fight'?150:260;q.x+=dx/d*v*dt;q.y+=dy/d*v*dt;}if(d<4){q.got=1;G.xp+=q.v;sfx('gem');}}
  gems=gems.filter(q=>!q.got);
  en=en.filter(e=>!e.dead);
  for(const o of OBS)o.flash-=dt;
  for(const b of bolts)b.t-=dt;bolts=bolts.filter(b=>b.t>0);
  for(const r of rings)r.t-=dt;rings=rings.filter(r=>r.t>0);
  for(const n of nums){n.t-=dt;n.y-=18*dt;}nums=nums.filter(n=>n.t>0);
  G.shake-=dt;G.flash-=dt;G.hurtT-=dt;
  if(G.state==='play'&&G.bonusPick){G.bonusPick=false;openPick(true);}
  else if(G.xp>=G.need&&G.state==='play')openPick();
}
function swordPos(){const out=[],n=st.swords,m=G.tempSwT>0?10:0;

function avail(t,ex=[]){return HEX.filter(h=>h.tier===t&&!G.owned.has(h.id)&&!ex.includes(h.id));}
function pickW(list,n){const out=[],a=list.slice();
  while(out.length<n&&a.length){const w=a.map(h=>1+(G.tags[h.tag]||0)*1.5);let r=rand()*w.reduce((x,y)=>x+y,0),i=0;
    while(i<a.length-1&&(r-=w[i])>0)i++;out.push(a.splice(i,1)[0]);}
  return out;}
function rollTier(lvl){
  const w=[Math.max(25,70-lvl*3),22+lvl,4+lvl*1.5];
  let ok=[1,2,3].filter(t=>avail(t).length>=3);if(!ok.length)ok=[1,2,3].filter(t=>avail(t).length);if(!ok.length)return 0;
  let r=rand()*ok.reduce((s,t)=>s+w[t-1],0);for(const t of ok)if((r-=w[t-1])<=0)return t;return ok[ok.length-1];
}
function makeOffer(lvl){const tier=rollTier(lvl);return{tier,cards:tier?pickW(avail(tier),3):[]};}
function openPick(bonus){
  if(!bonus){G.xp-=G.need;G.lvl++;G.need=5+4*G.lvl+3*G.lvl*G.lvl;}
  const o=bonus&&avail(3).length>=3?{tier:3,cards:pickW(avail(3),3)}:makeOffer(G.lvl);o.bonus=bonus;
  if(!o.tier){st.atkDmg*=1.1;toast('海克斯已全部获得 · 攻击 +10%');return;}
  G.offer=o;G.rer=[0,0,0];G.state='pick';sfx('lvl');G.pickDown='';joy.x=joy.y=0;renderPick();$('pick').classList.add('on');
}
function synHTML(tag){
  const c=G.tags[tag]||0,n=c+1,s=SETS[tag];let h='';
  for(let i=0;i<3;i++)h+=`<i class="${i<c?'on':i===c?'nx':''}"></i>`;
  const info=s[n]?`<div class="si on">激活 ${n} 件<br>${s[n][0]}</div>`:`<div class="si">2 件：<br>${s[2][0]}</div>`;
  return `<div class="syn"><span>${tag}</span>${h}</div>${info}`;
}
function renderPick(){

  $('pick').innerHTML=`<div class="head"><div class="lv">${G.offer.bonus?'BOSS 奖励':`LV ${G.lvl-1} → ${G.lvl}`}</div><h1>选择海克斯</h1>
    <p><b class="tag ${tc}" style="padding:1px 8px">${tn}</b>　点击卡牌直接获得</p></div>
    <div class="cards">${G.offer.cards.map((h,i)=>`<div class="col"><div class="cw" data-i="${i}"><div class="card cut"><div class="inner cut">
      <div class="icon">${ICON[TAGICON[h.tag]]}</div><div class="t">${h.n}</div><div class="tag ${tc}">${tn}</div><div class="div"></div>
      <div class="d">${h.d}</div>${synHTML(h.tag)}</div></div></div>
      <div class="reroll${G.rer[i]?' used':''}" data-r="${i}"><svg viewBox="0 0 12 12"><rect x=".5" y="2" width="11" height="8" rx="1" fill="none" stroke="currentColor"/><path d="M5 4.2v3.6L8 6z" fill="currentColor"/></svg>${G.rer[i]?'已刷新':'刷新'}</div></div>`).join('')}</div>
    <div class="build"><p>当前流派</p><div class="chips">${chips||'<span class="chip" style="padding-left:7px">暂无</span>'}</div></div>`;

function choose(i){
  if(G.state!=='pick')return;
  const h=G.offer.cards[i];if(!h)return;
  h.a();G.owned.add(h.id);

function reroll(i){

    if(n)G.offer.cards[i]=n;else toast('该品质没有可替换的海克斯');G.rer[i]=1;renderPick();});

    ${G.revived?'':'<button class="b" id="rev">看广告复活</button>'}<button class="b ghost" id="again">重新开始</button>`;
  $('dead').classList.add('on');
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}
function banner(){const e=$('banner');e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1200);}

// ---------- 输入 ----------
const phone=$('phone');
function toPhone(e){const r=phone.getBoundingClientRect(),s=r.width/390;return[(e.clientX-r.left)/s,(e.clientY-r.top)/s];}
phone.addEventListener('pointerdown',e=>{
  if(e.target.closest('#pick,#dead,#start,#ad'))return;
  if(e.target.closest('#muteB')){toggleMute();return;}
  if(e.target.closest('#ult')){castUlt();return;}
  if(G.state!=='play'||joy.id!==null)return;
  const[x,y]=toPhone(e);joy.id=e.pointerId;joy.ox=x;joy.oy=y;
  const j=$('joy');j.style.left=x+'px';j.style.top=y+'px';j.classList.add('act');
});
addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;const[x,y]=toPhone(e);let dx=x-joy.ox,dy=y-joy.oy;const l=Math.hypot(dx,dy);
  if(l>34){dx*=34/l;dy*=34/l;}joy.x=dx/34;joy.y=dy/34;$('knob').style.transform=`translate(${dx}px,${dy}px)`;});
function endJoy(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;$('knob').style.transform='';
  const j=$('joy');j.style.left='195px';j.style.top='600px';j.classList.remove('act');}
addEventListener('pointerup',endJoy);addEventListener('pointercancel',endJoy);
// 选卡：按下和抬起在同一张卡上即生效（一次点击）；战斗中手指拖到弹窗上松开不会误选
const pickKey=e=>{const c=e.target.closest('[data-i],[data-r]');return c?(c.dataset.i!==undefined?'i'+c.dataset.i:'r'+c.dataset.r):'';};
$('pick').addEventListener('pointerdown',e=>{G.pickDown=pickKey(e);});
$('pick').addEventListener('pointerup',e=>{const k=pickKey(e);if(!k||k!==G.pickDown)return;G.pickDown='';
  if(k[0]==='i')choose(+k.slice(1));else reroll(+k.slice(1));});
$('dead').addEventListener('click',e=>{
  if(e.target.id==='again'){$('dead').classList.remove('on');reset();music('normal');}
  if(e.target.id==='rev')showAd(()=>{G.revived=true;pl.hp=pl.maxHp;music(G.boss?'boss':'normal');pl.inv=2;$('dead').classList.remove('on');G.state='play';nova(80,60);});
});
$('go').onclick=()=>{$('start').classList.remove('on');reset();auInit();music('normal');};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
  if(k==='j'||k===' ')castSkill();if(k==='k')castUlt();
  if(G.state==='pick'&&'123'.includes(k))choose(+k-1);});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

$('muteB').classList.toggle('off',AU.muted);
const fit=()=>phone.style.transform=`scale(${Math.min(innerWidth/390,innerHeight/693)})`;fit();addEventListener('resize',fit);

// self-check：每轮三张卡同品质且不重复；每个流派三档各一张
reset();
for(let i=0;i<300;i++){const o=makeOffer(1+i%15);console.assert(o.cards.length===3&&o.cards.every(h=>h.tier===o.tier)&&new Set(o.cards.map(h=>h.id)).size===3,'offer check failed',o);}
for(const t in SETS)console.assert([1,2,3].every(r=>HEX.filter(h=>h.tag===t&&h.tier===r).length===1),'set check failed',t);
G.state='start';
requestAnimationFrame(frame);
</script>
</body>
