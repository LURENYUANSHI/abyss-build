<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深渊构筑原型</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>

  #phone{position:relative;width:390px;height:693px;overflow:hidden;background:#07070c;flex:none;transform-origin:center}
  #g{position:absolute;left:0;top:0;width:390px;height:693px}

  /* HUD */
  .hud{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:flex-start;color:#fff;z-index:5;pointer-events:none}
  #ava{width:38px;height:38px;border:1px solid rgba(170,140,255,.6);background:#141631;image-rendering:pixelated}
  .bars{flex:1;display:flex;flex-direction:column;gap:3px;padding-top:2px}
  .bar{height:8px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:100%}
  .bar.sh{height:3px;display:none}.bar.sh.on{display:block}

  .xp{position:absolute;left:0;right:0;top:64px;height:5px;background:rgba(255,255,255,.08);z-index:5;pointer-events:none}

  #lvT{position:absolute;left:12px;top:74px;font:7px "Press Start 2P";color:#5ad1ff;z-index:5;line-height:1.8}
  #buffT{position:absolute;left:12px;top:96px;font-size:10px;color:#ffd77a;z-index:5;line-height:1.5;pointer-events:none}
  #mm{position:absolute;right:12px;top:76px;width:64px;height:64px;z-index:5;pointer-events:none;background:rgba(10,10,20,.55);border:1px solid rgba(170,140,255,.3)}

  /* 操作 */
  #joy{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);z-index:4;pointer-events:none;left:195px;top:600px;opacity:0}

  #knob{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.3)}

  #skill{right:84px;bottom:28px;width:44px;height:44px;border:2px solid #6fdcff;color:#9ff1ff;font-size:10px;font-weight:700;

  #hint{position:absolute;left:0;right:0;bottom:92px;text-align:center;font-size:10px;color:rgba(200,195,240,.45);letter-spacing:2px;z-index:4;pointer-events:none}

  #toast,#banner{position:absolute;left:0;right:0;text-align:center;z-index:20;pointer-events:none;opacity:0;transition:opacity .3s}
  #toast{top:150px;color:#ffd77a;font-size:12px;letter-spacing:1px;padding:0 20px}
  #banner{top:250px;color:#ff6a6a;font-size:22px;font-weight:900;letter-spacing:6px;text-shadow:0 0 12px #f00}
  .show{opacity:1!important}

  .ov{position:absolute;inset:0;z-index:10;display:none;color:#fff}
  .ov.on{display:block}

  #pick{background:linear-gradient(180deg,rgba(4,4,12,.5) 0,rgba(4,4,12,.72) 22%,rgba(4,4,12,.88) 32%,rgba(4,4,12,.88) 74%,rgba(4,4,12,.7) 100%)}
  .head{position:absolute;left:0;right:0;top:112px;text-align:center}
  .lv{font:8px "Press Start 2P";color:#5ad1ff;letter-spacing:1px;margin-bottom:10px}
  .head h1{margin:0;font-size:23px;font-weight:900;letter-spacing:6px;display:flex;align-items:center;justify-content:center;gap:12px}
  .head h1::before,.head h1::after{content:"";width:40px;height:1px;background:linear-gradient(90deg,transparent,#a07cff)}
  .head h1::after{transform:scaleX(-1)}
  .head p{margin:8px 0 0;font-size:11px;color:#8d90ad;letter-spacing:2px}
  .cards{position:absolute;left:0;right:0;top:206px;display:flex;justify-content:center;gap:9px}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px;animation:rise .3s ease-out both}

  .card{width:116px;height:310px;padding:1px;box-sizing:border-box;background:linear-gradient(180deg,#b18cff,#6a4fd0 50%,#9b7bff);cursor:pointer}

  .excl{font-size:9px;color:#ffd77a;margin-top:4px;letter-spacing:1px}
  .reroll{font-size:10px;color:#9a9dbb;border:1px solid rgba(160,140,255,.28);background:rgba(15,16,32,.7);padding:5px 12px;display:flex;align-items:center;gap:5px;cursor:pointer;letter-spacing:1px}

  .chip{display:flex;align-items:center;gap:3px;font-size:10px;color:#c8c0ff;padding:2px 7px 2px 3px;border:1px solid rgba(170,140,255,.25);border-radius:10px;background:rgba(18,19,42,.8)}
  .chip svg{width:14px;height:14px}.chip.full{color:#ffd77a;border-color:rgba(255,200,90,.45)}

  /* 大招特写 */
  #cutin{z-index:30;pointer-events:none;overflow:hidden}
  #cutin .dk{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade 1s both}
  #cutin .band{position:absolute;left:-30px;right:-30px;top:240px;height:220px;transform:skewY(-9deg);background:linear-gradient(90deg,#120a2c,#3a1c7c 55%,#120a2c);
    box-shadow:0 0 0 2px #b48cff,0 0 40px #8a55ff;animation:band 1s both}
  #cutin .lines{position:absolute;inset:0;background:repeating-linear-gradient(-9deg,transparent 0 14px,rgba(255,255,255,.06) 14px 15px)}
  #cutin canvas{position:absolute;left:-6px;top:196px;width:288px;height:288px;image-rendering:pixelated;filter:drop-shadow(0 0 10px #6fdcff);animation:slide 1s both}
  #cutin .nm{position:absolute;right:18px;top:356px;text-align:right;animation:nm 1s both}

  #cutin .nm small{font-size:11px;letter-spacing:3px;color:#cdb8ff}
  @keyframes fade{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}
  @keyframes band{0%{transform:skewY(-9deg) scaleY(0)}12%{transform:skewY(-9deg) scaleY(1)}85%{opacity:1}100%{transform:skewY(-9deg) scaleY(1.1);opacity:0}}
  @keyframes slide{0%{transform:translateX(-260px)}18%{transform:translateX(0)}85%{transform:translateX(18px);opacity:1}100%{transform:translateX(60px);opacity:0}}
  @keyframes nm{0%,10%{transform:translateX(220px);opacity:0}28%{transform:translateX(0);opacity:1}85%{opacity:1}100%{opacity:0}}

  .panel{position:absolute;inset:0;background:rgba(5,5,14,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
  .panel h2{margin:0;font-size:30px;font-weight:900;letter-spacing:8px}
  .panel p{margin:0;color:#9da0bd;font-size:12px;line-height:1.8}
  .b{min-width:200px;padding:12px 0;font-size:15px;letter-spacing:4px;color:#fff;border:1px solid #9b7bff;background:#2b1f63;cursor:pointer;font-family:inherit}
  .b.ghost{background:transparent;color:#c8bfff}
  .stat{display:flex;gap:18px;font-size:11px;color:#9da0bd}.stat b{display:block;font:11px "Press Start 2P";color:#fff;margin-top:6px}

  #adN{font:28px "Press Start 2P";color:#fff}
  /* 选角 */
  .classes{display:grid;grid-template-columns:repeat(3,96px);gap:8px}
  .cls{height:82px;border:1px solid rgba(160,140,255,.25);background:rgba(15,16,32,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:12px;color:#c8c0ff}
  .cls canvas{width:36px;height:42px;image-rendering:pixelated}
  .cls.on{border-color:#ffd77a;color:#fff;box-shadow:0 0 10px rgba(255,215,120,.35)}

  .cinfo b{color:#fff}.cinfo em{font-style:normal;color:#ffd77a}
  .ver{font:8px "Press Start 2P";color:#6f7290}
  #home .panel,#levels .panel,#start .panel{background:#07070c}
  #homeArt{width:390px;height:180px;image-rendering:pixelated}
  .row{display:flex;gap:10px}.b.sm{min-width:0;padding:8px 14px;font-size:12px;letter-spacing:1px}
  .lvgrid{display:grid;grid-template-columns:repeat(2,168px);gap:8px;margin:6px 0 4px}
  .lv1{height:64px;border:1px solid rgba(160,140,255,.3);background:rgba(15,16,32,.85);text-align:left;padding:6px 9px;box-sizing:border-box;cursor:pointer;position:relative;border-left:3px solid var(--c)}
  .lv1 b{font-size:13px;color:#fff;letter-spacing:1px}.lv1 small{display:block;font-size:10px;color:#9da0bd;line-height:1.5}
  .lv1.lock{opacity:.35;cursor:default}.lv1.clr::after{content:"✓";position:absolute;right:8px;top:6px;color:#ffd77a;font-size:12px}
</style>
</head>
<body>
<div id="phone">
  <canvas id="g"></canvas>

  <div class="hud">
    <canvas id="ava"></canvas>
    <div class="bars">
      <div class="bar"><i id="hpI"></i></div><div class="bar sh" id="shB"><i id="shI"></i></div><small id="hpT">150/150</small>
      <div class="bar"><i id="enI"></i></div>
    </div>
    <div class="right"><b id="stageT">1-1</b> <span id="lvName">地下墓穴</span><br><span id="killT"></span></div>
  </div>
  <div class="xp"><i id="xpI"></i></div>
  <div id="lvT">LV 1</div>
  <div id="buffT"></div>
  <canvas id="mm" width="64" height="64"></canvas>
  <div id="bossBar"><span id="bossN"></span><div class="bar"><i id="bossI"></i></div></div>

  <div id="joy"><div id="knob"></div></div>
  <div class="btn" id="muteB">♪</div>
  <div id="hint"></div>
  <div class="btn" id="skill">技能</div>
  <div class="btn" id="ult"><span>大招</span></div>
  <div id="toast"></div>
  <div id="banner"></div>

  <div id="fade"></div>
  <div class="ov" id="pick"></div>

  <div class="ov" id="cutin"><div class="dk"></div><div class="band"><div class="lines"></div></div><canvas id="por"></canvas>
    <div class="nm"><small id="cutSub"></small><b id="cutName"></b></div></div>

  <div class="ov on" id="home"><div class="panel">
    <canvas id="homeArt" width="195" height="90"></canvas>
    <h2 style="font-size:38px">深渊构筑</h2><p style="margin-top:-8px;letter-spacing:4px">像素地牢 · 构筑割草</p>

    <div class="row"><button class="b ghost sm" id="sndB">音效：开</button><button class="b ghost sm" id="shkB">镜头震动：开</button></div>
    <p style="font-size:10px;opacity:.6">单手全自动 · 按住拖动可接管走位</p><p class="ver" id="ver"></p></div></div>

  <div class="ov" id="levels"><div class="panel" style="justify-content:flex-start;padding-top:40px">
    <h2 style="font-size:24px">选择关卡</h2><p>每关 6 个地牢 · 第 3 间精英 · 第 6 间首领</p>
    <div class="lvgrid" id="lvgrid"></div>
    <button class="b ghost" id="lvBack">返回主页</button></div></div>

  <div class="ov" id="start"><div class="panel">
    <h2 style="font-size:22px" id="startTitle">选择职业</h2>
    <div class="classes" id="classes"></div>
    <div class="cinfo" id="cinfo"></div>
    <button class="b" id="go">出发</button><button class="b ghost sm" id="clsBack">返回关卡</button></div></div>

  <div class="ov" id="dead"><div class="panel" id="deadP"></div></div>
  <div class="ov" id="ad"><div class="panel"><p>激励视频（原型模拟）</p><div id="adN">2</div><p>完整观看后发放奖励</p></div></div>
</div>

function auInit(){
  if(AU.ctx){AU.ctx.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C();
  AU.master=c.createGain();AU.master.gain.value=AU.muted?0:1;AU.master.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=.16;AU.mus.connect(AU.master);
  AU.sfx=c.createGain();AU.sfx.gain.value=.32;AU.sfx.connect(AU.master);
  const n=c.sampleRate>>1,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=rand()*2-1;AU.noise=b;
  setInterval(schedule,25);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(t,f,dur,type,vol,out,f2){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.02);}
function noise(t,dur,vol,out,hp){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;
  f.type=hp?'highpass':'lowpass';f.frequency.value=hp||1200;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(out);s.start(t);s.stop(t+dur+.02);}
// 和弦进行：[根音 midi, 是否大三和弦]；地牢 Am-F-C-G，首领 Dm-B♭-Gm-A
const SONGS={normal:{bpm:118,ch:[[57,0],[53,1],[48,1],[55,1]]},boss:{bpm:158,ch:[[50,0],[46,1],[55,0],[57,1]]}};
function schedule(){
  const c=AU.ctx;if(!c||!AU.song)return;
  const S=SONGS[AU.song],sp=60/S.bpm/4,boss=AU.song==='boss';
  while(AU.next<c.currentTime+.12){
    const t=AU.next,k=AU.step%16,[root,maj]=S.ch[(AU.step>>4)%4],iv=[0,maj?4:3,7,12];
    if(boss?k%2===0:[0,3,6,8,11,14].includes(k))tone(t,mf(root-12),sp*1.6,'triangle',.5,AU.mus);
    tone(t,mf(root+12+iv[k%4]),sp*.9,'square',.09,AU.mus);
    if(k%8===0||(boss&&k%4===0))tone(t,150,.12,'sine',.7,AU.mus,40);
    if(k%8===4)noise(t,.12,.35,AU.mus,1500);
    if(k%2===0)noise(t,.03,.12,AU.mus,7000);
    AU.next+=sp;AU.step++;
  }
}
function music(name){if(!AU.ctx||AU.song===name)return;AU.song=name;AU.step=0;AU.next=AU.ctx.currentTime+.05;}
function sfx(k){
  const c=AU.ctx;if(!c||AU.muted)return;const t=c.currentTime,o=AU.sfx;
  const gap={shoot:.07,slash:.07,kill:.04,hurt:.15}[k];if(gap){if(t-(AU.last[k]||0)<gap)return;AU.last[k]=t;}
  switch(k){
    case'shoot':tone(t,900,.05,'square',.05,o,500);break;
    case'slash':noise(t,.06,.12,o,2500);tone(t,500,.05,'triangle',.05,o,250);break;
    case'kill':tone(t,420,.06,'square',.08,o,180);break;
    case'hurt':tone(t,240,.15,'sawtooth',.25,o,90);break;
    case'zap':tone(t,1600,.25,'sawtooth',.18,o,180);noise(t,.2,.25,o,3000);break;
    case'cutin':tone(t,220,.6,'sawtooth',.15,o,1400);tone(t,330,.6,'square',.08,o,2100);break;
    case'ult':tone(t,120,.9,'sawtooth',.4,o,30);noise(t,.8,.6,o);tone(t,60,.9,'sine',.8,o,25);break;
    case'lvl':[72,76,79,84].forEach((m,i)=>tone(t+i*.06,mf(m),.18,'triangle',.25,o));break;
    case'pick':tone(t,mf(79),.12,'square',.12,o);tone(t+.08,mf(86),.2,'square',.12,o);break;
    case'boss':tone(t,70,1.2,'sawtooth',.4,o,40);noise(t,1,.4,o);break;
    case'crate':noise(t,.12,.35,o);tone(t,180,.1,'square',.15,o,80);break;
    case'door':tone(t,90,.3,'square',.2,o,60);noise(t,.25,.3,o);break;
    case'dead':[64,60,57,52].forEach((m,i)=>tone(t+i*.18,mf(m),.3,'triangle',.3,o));break;
  }
}

function bossAI(b,dt){

  else{const s=SK[b.mode];if(s.tick)s.tick(b,dt,f);if(b.at<=0){endSkill(b);b.mode='walk';b.at=(b.big?1.3:1.6)*f;}}

  const t=ET[k],hp=t.hp*G.hpMul*(k==='SP'?3:1),R=G.rm;

    flash:0,poison:0,pt:.5,scd:0,dead:false,shotT:1+rand()*2,burnT:0,burnD:0,bt:.5,slowT:0,frozenT:0};
  pushOut(e,3);en.push(e);return e;}
function spawnInRoom(){const R=G.rm;for(let i=0;i<12;i++){const x=R.x+10+rand()*(R.w-20),y=R.y+10+rand()*(R.h-20);
  if(Math.hypot(x-pl.x,y-pl.y)>60&&!solidAt(x,y)){rings.push({x,y,r0:1,r1:8,t:.3,T:.3,col:'#c99bff'});return spawnAt(x,y);}}
  return spawnAt(R.x+10,R.y+10);}
function num(x,y,v,col,big){if(nums.length<90)nums.push({x:x-4+rand()*4,y,s:String(v),col,big,t:.7});}
function dmg(e,d,o={}){
  if(e.dead||e.inv)return;let crit=false;
  const cc=st.crit+(G.critBuffT>0?.5:0)+(G.songT>0?st.songCrit:0)+(G.critT>0&&o.src==='atk'?1:0);
  if(o.forceCrit||(!o.nocrit&&rand()<cc)){d*=st.critDmg;crit=true;}
  d*=G.pm;
  if(e.poison)d*=st.corrode;
  if(e.slowT>0)d*=st.slowBonus;
  if(e.frozenT>0&&st.shatter)d*=2;
  if(e.boss)d*=st.bossDmg;
  if(o.src==='atk'){if(st.rage&&pl.hp<pl.maxHp*.5)d*=1.6;if(st.shieldBash&&pl.shield>0)d*=1.4;}
  if(G.songT>0&&st.epicSong)d*=1.5;
  if(G.adrT>0)d*=2;
  e.hp-=d;e.flash=.08;G.dmgAcc+=d;G.roomDmg+=d;num(e.x,e.y-6,Math.round(d),crit?'#ffd34a':o.col||'#fff',crit);
  if(o.poison)e.poison=Math.min(st.poisonCap,e.poison+o.poison);
  if(o.src==='atk'&&st.vamp)pl.hp=Math.min(pl.maxHp,pl.hp+d*st.vamp);
  if(crit&&st.critSplash&&!o.splash)for(const x of en)if(x!==e&&!x.dead&&Math.hypot(x.x-e.x,x.y-e.y)<14)dmg(x,d*.5/G.pm,{nocrit:true,splash:true,col:'#ffd34a'});
  if(st.execute&&o.src==='atk'&&!e.boss&&e.hp>0&&e.hp<e.max*st.execute){e.hp=0;num(e.x,e.y-12,'斩','#ff6a6a',true);}
  if(e.hp<=0)kill(e);
}
function kill(e){

  if(e.frozenT>0&&st.shatter)G.booms.push({x:e.x,y:e.y,r:14,d:A*.6,eff:'ice'});

    toast(`击败 ${e.name}`);}
}
function boom(x,y,r,d,eff){const col={fire:'#ff9a4a',ice:'#9fe8ff',poison:'#a6ec6c'}[eff]||'#ffe8a0';rings.push({x,y,r0:2,r1:r,t:.3,T:.3,col});

function swing(a,whirl){
  const T=AT[CLS[G.cls].atk],reach=T.reach*st.rangeMul*(whirl?1.3:1),half=whirl?Math.PI:Math.min(Math.PI,T.arc*st.arcMul),A=atkBase()*st.basicMul;

function nearestLos(p,r){let b=null,bd=r*r;for(const e of en){if(e.dead||e.inv)continue;const q=(e.x-p.x)**2+(e.y-p.y)**2;if(q<bd&&los(p,e)){bd=q;b=e;}}return b;}
function nearest(x,y,r,skip){let b=null,bd=r*r;for(const e of en){if(e.dead||e.inv||(skip&&skip.has(e)))continue;const q=(e.x-x)**2+(e.y-y)**2;if(q<bd){bd=q;b=e;}}return b;}
function jag(pts){const out=[pts[0]];for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];
  for(let k=1;k<4;k++){const t=k/4;out.push([a[0]+(b[0]-a[0])*t+(rand()-.5)*6,a[1]+(b[1]-a[1])*t+(rand()-.5)*6]);}out.push(b);}return out;}
function chain(sx,sy,n,first,hop,d,skip){

function hurt(d){

function danger(x,y){

  const b=G.boss;if(!b)return false;
  for(const t of b.tels)if(!t.done&&!t.harmless&&telHit(t,x,y,5))return true;
  if(b.aim){const ux=Math.cos(b.aim.a),uy=Math.sin(b.aim.a),px=x-b.x,py=y-b.y;if(px*ux+py*uy>-10&&Math.abs(-px*uy+py*ux)<15)return true;}
  if(b.sw){for(let k=0;k<=5;k++)if(rayNear(b,b.sw.a+b.sw.va*k*.15,x,y,10))return true;}
  return false;
}
function autoDir(){
  const R=G.rm,C=CLS[G.cls];
  if(danger(pl.x,pl.y)){let best=null,bd=1e9;
    for(let i=0;i<7;i++)for(let j=0;j<9;j++){const x=R.x+8+(R.w-16)*i/6,y=R.y+8+(R.h-16)*j/8;if(solidAt(x,y)||danger(x,y))continue;
      const d=(x-pl.x)**2+(y-pl.y)**2;if(d<bd){bd=d;best={x,y};}}
    if(best){const dx=best.x-pl.x,dy=best.y-pl.y,d=Math.hypot(dx,dy)||1;return[dx/d,dy/d];}}
  let vx=0,vy=0;
  for(const e of en){if(e.inv||e.k==='SP')continue;const dx=pl.x-e.x,dy=pl.y-e.y,d2=dx*dx+dy*dy;if(d2<60*60&&d2>1){const w=(e.boss?8:1)*C.kite/d2;vx+=dx*w;vy+=dy*w;}}
  for(const o of shots){const dx=pl.x-o.x,dy=pl.y-o.y,d2=dx*dx+dy*dy;if(d2<30*30&&d2>1){const w=3/d2;vx+=dx*w;vy+=dy*w;}}
  const wall=d=>d<24?(24-d)/24*.06:0;
  vx+=wall(pl.x-R.x)-wall(R.x+R.w-pl.x);vy+=wall(pl.y-R.y)-wall(R.y+R.h-pl.y);
  for(const o of OBS){if(o.dead)continue;const nx=clamp(pl.x,o.x,o.x+o.w),ny=clamp(pl.y,o.y,o.y+o.h),dx=pl.x-nx,dy=pl.y-ny,d=Math.hypot(dx,dy);
    if(d<10&&d>0){vx+=dx/d*(10-d)*.006;vy+=dy/d*(10-d)*.006;}}
  const m=Math.hypot(vx,vy),k=Math.min(1,m/.05);let tx=m?vx/m*k:0,ty=m?vy/m*k:0;
  const tl=nearestLos(pl,260),t=tl||nearest(pl.x,pl.y,260),want=tl?AT[C.atk].range*st.rangeMul*.7:t?8:16;
  if(pl.wp&&(pl.wpT-=1/30)<=0)pl.wp=null;
  const gx=pl.wp?pl.wp.x:t?t.x:R.cx,gy=pl.wp?pl.wp.y:t?t.y:R.cy,dx=gx-pl.x,dy=gy-pl.y,d=Math.hypot(dx,dy);
  if(d>want){const s=Math.min(.8,(d-want)/30)*(1-k*.7);tx+=dx/d*s;ty+=dy/d*s;}
  return[tx,ty];
}

function avail(t,ex=[]){return HEX.filter(h=>h.tier===t&&fits(h)&&!G.owned.has(h.id)&&!ex.includes(h.id));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(rand()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickW(list,n){const out=[],a=list.slice();
  while(out.length<n&&a.length){const w=a.map(h=>(1+(G.tags[h.tag]||0)*1.5)*(h.cls?2:1));let r=rand()*w.reduce((x,y)=>x+y,0),i=0;
    while(i<a.length-1&&(r-=w[i])>0)i++;out.push(a.splice(i,1)[0]);}
  return out;}
function rollTier(lvl){
  const w=[Math.max(25,70-lvl*3),22+lvl,4+lvl*1.5];
  let ok=[1,2,3].filter(t=>avail(t).length>=3);if(!ok.length)ok=[1,2,3].filter(t=>avail(t).length);if(!ok.length)return 0;
  let r=rand()*ok.reduce((s,t)=>s+w[t-1],0);for(const t of ok)if((r-=w[t-1])<=0)return t;return ok[ok.length-1];
}
function makeOffer(lvl,tier){if(!tier||avail(tier).length<3)tier=rollTier(lvl);return{tier,cards:tier?pickW(avail(tier),3):[]};}
function openPick(bonus){

}
