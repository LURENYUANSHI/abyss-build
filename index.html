<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>深渊构筑</title><style>html,body{margin:0;height:100%;background:#07070c}</style></head>
<body><script>
// 入口：每次都绕过缓存拉取最新的 game.html，链接永远是最新版（不用再带 ?v=）
fetch('game.html?t='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{document.open();document.write(t);document.close();})
  .catch(()=>{location.replace('game.html');});
</script></body></html>
